<!DOCTYPE html>
<html lang="rn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Depp Net - Register</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f2f4f7;color:#222}
header{background:#1877f2;color:#fff;text-align:center;padding:18px;font-size:25px;font-weight:bold}
.box{width:92%;max-width:430px;margin:25px auto}
.card{background:#fff;padding:22px;border-radius:16px;box-shadow:0 3px 12px #ccc}
h2{text-align:center}
input,select{width:100%;padding:13px;margin:6px 0;border:1px solid #ccc;border-radius:10px;font-size:16px}
input[type=date]{color:#555}
.err{color:#d00000;font-size:13px;min-height:16px}
button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:10px;background:#1877f2;color:#fff;font-size:16px;font-weight:bold}
#result{display:none;margin-top:12px;padding:12px;border-radius:9px;text-align:center}
a{display:block;text-align:center;margin-top:15px;color:#1877f2;text-decoration:none}
</style>
</head>

<body>
<header>Depp Net</header>

<div class="box">
<div class="card">

<h2>📝 Iyandikishe</h2>

<input id="name" placeholder="Amazina yawe">
<div id="en" class="err"></div>

<input id="username" placeholder="Username">
<div id="eu" class="err"></div>

<input id="email" type="email" placeholder="Email">
<div id="ee" class="err"></div>

<input id="phone" type="tel" placeholder="Numero ya telefone">
<div id="ep" class="err"></div>

<input id="birth" type="date">
<div id="eb" class="err"></div>

<select id="sex">
<option value="">-- Hitamwo Sexe --</option>
<option value="Gabo">Gabo</option>
<option value="Gore">Gore</option>
</select>
<div id="es" class="err"></div>

<input id="password" type="password" placeholder="Mot de passe">
<div id="epw" class="err"></div>

<input id="password2" type="password" placeholder="Subiramwo mot de passe">
<div id="epw2" class="err"></div>

<button id="btn" onclick="register()">📝 Iyandikishe</button>

<div id="result"></div>

<a href="login.html">🔐 Usanzwe ufise konti? Injira</a>
<a href="index.html">⬅️ Subira inyuma</a>

</div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{
getAuth,createUserWithEmailAndPassword,
setPersistence,browserLocalPersistence
}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{
getFirestore,doc,setDoc,query,collection,
where,getDocs
}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const app=initializeApp({
apiKey:"AIzaSyAddn7bUZfDupIqFsvBbXRpxarFAsV2lYs",
authDomain:"depp-net-apk.firebaseapp.com",
projectId:"depp-net-apk",
storageBucket:"depp-net-apk.firebasestorage.app",
messagingSenderId:"664141462348",
appId:"1:664141462348:web:8202143fef6fcdaf9cede9"
});

const auth=getAuth(app);
const db=getFirestore(app);

function err(id,t){
document.getElementById(id).textContent=t;
}

function result(t,ok=false){
let x=document.getElementById("result");
x.style.display="block";
x.textContent=t;
x.style.background=ok?"#e4ffe9":"#ffe5e5";
x.style.color=ok?"#087a1d":"#c00000";
}

window.register=async()=>{

["en","eu","ee","ep","eb","es","epw","epw2"]
.forEach(x=>err(x,""));

let name=document.getElementById("name").value.trim();
let username=document.getElementById("username").value.trim().toLowerCase();
let email=document.getElementById("email").value.trim().toLowerCase();
let phone=document.getElementById("phone").value.trim().replace(/\D/g,"");
let birth=document.getElementById("birth").value;
let sex=document.getElementById("sex").value;
let pass=document.getElementById("password").value;
let pass2=document.getElementById("password2").value;

let ok=true;

if(!name){err("en","Andika amazina.");ok=false}
if(!username){err("eu","Andika username.");ok=false}

if(!email){
err("ee","Andika Email.");
ok=false;
}else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
err("ee","Email siyo.");
ok=false;
}

if(!phone){
err("ep","Andika numero.");
ok=false;
}else if(phone.length<6){
err("ep","Numero ni ngufi cane.");
ok=false;
}

if(!birth){
err("eb","Hitamwo itariki y'amavuko.");
ok=false;
}

if(!sex){
err("es","Hitamwo Sexe.");
ok=false;
}

if(!pass){
err("epw","Andika mot de passe.");
ok=false;
}else if(pass.length<6){
err("epw","Mot de passe ibe nibura inyuguti 6.");
ok=false;
}

if(!pass2){
err("epw2","Subiramwo mot de passe.");
ok=false;
}else if(pass!==pass2){
err("epw2","Mot de passe ntizisa.");
ok=false;
}

if(!ok)return;

let btn=document.getElementById("btn");
btn.disabled=true;
btn.textContent="Turiko turakwiyandikisha...";

try{

let q=query(collection(db,"users"),where("phone","==",phone));
let old=await getDocs(q);

if(!old.empty){
err("ep","Iyi numero isanzwe ifise konti.");
btn.disabled=false;
btn.textContent="📝 Iyandikishe";
return;
}

await setPersistence(auth,browserLocalPersistence);

let r=await createUserWithEmailAndPassword(auth,email,pass);
let u=r.user;

let b=new Date(birth+"T00:00:00");
let today=new Date();

let age=today.getFullYear()-b.getFullYear();

if(
today.getMonth()<b.getMonth() ||
(today.getMonth()===b.getMonth() &&
today.getDate()<b.getDate())
)age--;

let user={
uid:u.uid,
id:u.uid,
name:name,
username:username,
email:email,
phone:phone,
birthDate:birth,
age:age,
sex:sex,
photo:""
};

await setDoc(doc(db,"users",u.uid),user);

localStorage.setItem("deppNetUser",JSON.stringify(user));
localStorage.setItem("deppNetLoggedIn","true");

result("Kwiyandikisha vyagenze neza!",true);

setTimeout(()=>{
location.href="home.html";
},700);

}catch(e){

console.log(e);

let code=e.code||"unknown";
let message=e.message||"Unknown error";

result("Ikosa: "+code+" | "+message);

btn.disabled=false;
btn.textContent="📝 Iyandikishe";
}
};
</script>

</body>
</html>
