<!DOCTYPE html>
<html lang="rn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Depp Net - Register</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f2f4f7;color:#222}
header{background:#1877f2;color:white;text-align:center;padding:18px;font-size:25px;font-weight:bold}
.box{width:92%;max-width:430px;margin:25px auto}
.card{background:white;padding:22px;border-radius:16px;box-shadow:0 3px 12px #ccc}
h2{text-align:center}
input,select{width:100%;padding:13px;margin:6px 0;border:1px solid #ccc;border-radius:10px;font-size:16px}
button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:10px;background:#1877f2;color:white;font-size:16px;font-weight:bold}
.msg{display:none;padding:10px;margin-top:10px;border-radius:8px;text-align:center}
.err{background:#ffe5e5;color:#c00}
a{display:block;text-align:center;margin-top:15px;color:#1877f2;text-decoration:none}
</style>
</head>
<body>

<header>Depp Net</header>

<div class="box">
<div class="card">
<h2>📝 Iyandikishe</h2>

<input id="name" placeholder="Amazina yawe">
<input id="username" placeholder="Username">
<input id="email" type="email" placeholder="Email">
<input id="phone" type="tel" placeholder="Numero ya telefone">

<input id="age" type="number" min="1" max="120" placeholder="Imyaka">

<select id="sex">
<option value="">-- Hitamwo Sexe --</option>
<option value="Gabo">Gabo</option>
<option value="Gore">Gore</option>
</select>

<input id="password" type="password" placeholder="Mot de passe">
<input id="password2" type="password" placeholder="Subiramwo mot de passe">

<button id="btn" onclick="register()">📝 Iyandikishe</button>

<div id="error" class="msg err"></div>

<a href="login.html">🔐 Usanzwe ufise konti? Injira</a>
<a href="index.html">⬅️ Subira inyuma</a>
</div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{
getAuth,
createUserWithEmailAndPassword,
setPersistence,
browserLocalPersistence
}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{
getFirestore,
doc,
setDoc,
query,
collection,
where,
getDocs
}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const app=initializeApp({
apiKey:"AIzaSyAddn7bUZfDupIqFsvBbXRpxarFAsV2lYs",
authDomain:"depp-net-apk.firebaseapp.com",
projectId:"depp-net-apk",
storageBucket:"depp-net-apk.firebasestorage.app",
messagingSenderId:"664141462348",
appId:"1:664141462348:web:8202143fef6fcdaf9cede9"
});

const auth=getAuth(app);
const db=getFirestore(app);

function error(t){
let e=document.getElementById("error");
e.textContent=t;
e.style.display="block";
}

window.register=async()=>{
let name=document.getElementById("name").value.trim();
let username=document.getElementById("username").value.trim().toLowerCase();
let email=document.getElementById("email").value.trim().toLowerCase();
let phone=document.getElementById("phone").value.trim().replace(/\D/g,"");
let age=document.getElementById("age").value;
let sex=document.getElementById("sex").value;
let pass=document.getElementById("password").value;
let pass2=document.getElementById("password2").value;
let btn=document.getElementById("btn");

if(!name||!username||!email||!phone||!age||!sex||!pass){
error("Uzuza ibisabwa vyose.");
return;
}

if(phone.length<6){
error("Andika numero ya telefone ibereye.");
return;
}

if(pass.length<6){
error("Mot de passe igomba kuba n'imibare/inyuguti 6 canke birenga.");
return;
}

if(pass!==pass2){
error("Mot de passe ntizisa.");
return;
}

btn.disabled=true;
btn.textContent="Turiko turakwiyandikisha...";

try{
let q=query(collection(db,"users"),where("phone","==",phone));
let old=await getDocs(q);

if(!old.empty){
error("Iyi numero isanzwe ifise konti.");
btn.disabled=false;
btn.textContent="📝 Iyandikishe";
return;
}

await setPersistence(auth,browserLocalPersistence);

let r=await createUserWithEmailAndPassword(auth,email,pass);
let u=r.user;

let user={
uid:u.uid,
id:u.uid,
name,
username,
email,
phone,
age:Number(age),
sex,
photo:""
};

await setDoc(doc(db,"users",u.uid),user);

localStorage.setItem("deppNetUser",JSON.stringify(user));
localStorage.setItem("deppNetLoggedIn","true");

location.href="home.html";

}catch(e){
let t="Kwiyandikisha vyanse.";
if(e.code==="auth/email-already-in-use")t="Iyo Email isanzwe ifise konti.";
if(e.code==="auth/invalid-email")t="Email siyo.";
if(e.code==="auth/weak-password")t="Mot de passe irorohereye cane.";
if(e.code==="auth/network-request-failed")t="Internet ntiyabonetse.";
error(t);
btn.disabled=false;
btn.textContent="📝 Iyandikishe";
}
};
</script>
</body>
</html>
