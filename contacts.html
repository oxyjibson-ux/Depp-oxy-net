<!DOCTYPE html>
<html lang="rn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Depp Net - Contacts</title>

<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#f2f4f7;color:#222}
header{background:#1877f2;color:white;padding:16px;display:flex;align-items:center;justify-content:space-between}
header b{font-size:22px}
header span{font-size:25px;cursor:pointer}
.box{width:94%;max-width:500px;margin:15px auto}
.card{background:white;padding:16px;border-radius:15px;margin-bottom:15px;box-shadow:0 2px 8px #ccc}
h3{margin-top:0}
input,select{width:100%;padding:13px;margin:6px 0;border:1px solid #ccc;border-radius:10px;font-size:16px}
button{border:0;border-radius:9px;padding:11px 15px;background:#1877f2;color:white;font-weight:bold}
.add{width:100%;margin-top:8px}
.contact{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;padding:13px 0}
.contact:last-child{border:0}
.info b{display:block}
.info small{color:#777}
.chat{background:#1877f2}
.none{color:#999;font-size:13px}
#msg{text-align:center;margin:8px;color:#1877f2}
</style>
</head>

<body>

<header>
<span onclick="history.back()">←</span>
<b>👥 Contacts</b>
<span onclick="searchBox()">🔍</span>
</header>

<div class="box">

<div class="card" id="searchCard" style="display:none">
<input id="search" placeholder="Rondera contact...">
</div>

<div class="card">
<h3>➕ Contact nshasha</h3>

<input id="name" placeholder="Izina rya contact">

<select id="code">
<option value="257">🇧🇮 +257 Burundi</option>
<option value="250">🇷🇼 +250 Rwanda</option>
<option value="255">🇹🇿 +255 Tanzania</option>
<option value="256">🇺🇬 +256 Uganda</option>
<option value="254">🇰🇪 +254 Kenya</option>
<option value="243">🇨🇩 +243 DR Congo</option>
<option value="971">🇦🇪 +971 UAE</option>
<option value="1">🇺🇸 +1 USA</option>
<option value="44">🇬🇧 +44 UK</option>
<option value="33">🇫🇷 +33 France</option>
<option value="49">🇩🇪 +49 Germany</option>
<option value="27">🇿🇦 +27 South Africa</option>
<option value="255">🇹🇿 +255 Tanzania</option>
<option value="91">🇮🇳 +91 India</option>
<option value="86">🇨🇳 +86 China</option>
</select>

<input id="phone" type="tel" placeholder="Numero ya telefone">

<button class="add" onclick="saveContact()">💾 Bika Contact</button>
<div id="msg"></div>
</div>

<div class="card">
<h3>📱 Contacts zawe</h3>
<div id="list">Turiko turarondera...</div>
</div>

</div>

<script type="module">

import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{
getAuth,
onAuthStateChanged
}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import{
getFirestore,
collection,
query,
where,
getDocs,
getDoc,
doc,
setDoc,
onSnapshot
}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyAddn7bUZfDupIqfSvBbXRpxarFAsV2lYs",
authDomain:"depp-net-apk.firebaseapp.com",
projectId:"depp-net-apk",
storageBucket:"depp-net-apk.firebasestorage.app",
messagingSenderId:"664141462348",
appId:"1:664141462348:web:8202143fef6fcdaf9cede9",
measurementId:"G-DMBZT3C6MK"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let me=null;
let all=[];

const $=x=>document.getElementById(x);

function clean(x){
return String(x||"").replace(/\D/g,"");
}

async function findUser(phone){

phone=clean(phone);

if(!phone)return null;

const q=query(
collection(db,"users"),
where("phone","==",phone)
);

const r=await getDocs(q);

return r.empty?null:r.docs[0];
}

function esc(x){
return String(x||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

async function load(){

if(!me)return;

onSnapshot(
collection(db,"users",me.uid,"contacts"),
async snap=>{

all=snap.docs.map(x=>({
id:x.id,
...x.data()
}));

render(all);

}
);

}

async function render(items){

if(!items.length){
$("list").innerHTML="<p class='none'>Nta contact urabika.</p>";
return;
}

$("list").innerHTML="Turiko turagenzura...";

let html="";

for(const x of items){

let u=null;

try{
u=await findUser(x.phone);
}catch(e){}

if(u){

const d=u.data();

if(x.uid!==u.id || !x.deppNet){
await setDoc(
doc(db,"users",me.uid,"contacts",x.id),
{
...x,
uid:u.id,
deppNet:true,
name:x.name||d.name||"Contact",
username:d.username||"",
updatedAt:new Date()
},
{merge:true}
);
}

html+=`
<div class="contact">
<div class="info">
<b>${esc(x.name||d.name||"Contact")}</b>
<small>${esc(x.phone)}</small>
</div>
<button class="chat"
onclick="chat('${u.id}','${esc(x.name||d.name||"Contact")}','${esc(x.phone)}')">
💬 Chat
</button>
</div>`;
}else{

html+=`
<div class="contact">
<div class="info">
<b>${esc(x.name||"Contact")}</b>
<small>${esc(x.phone)}</small>
</div>
<span class="none">Nta Depp Net</span>
</div>`;
}

}

$("list").innerHTML=html;
}

window.saveContact=async function(){

if(!me)return;

const name=$("name").value.trim();
const number=clean($("phone").value);
const code=clean($("code").value);

if(!name){
$("msg").textContent="Andika izina.";
return;
}

if(!number){
$("msg").textContent="Andika numero.";
return;
}

const phone=code+number;

$("msg").textContent="Turiko turabika...";

try{

const u=await findUser(phone);

const data={
name:name,
phone:phone,
uid:u?u.id:"",
deppNet:!!u,
createdAt:new Date()
};

await setDoc(
doc(db,"users",me.uid,"contacts",phone),
data,
{merge:true}
);

$("name").value="";
$("phone").value="";

$("msg").textContent=u
?"✅ Contact wa Depp Net yabonetse."
:"✅ Contact yabitswe. Nta Depp Net ubu.";

}catch(e){

console.log(e);
$("msg").textContent="❌ Ntivyashobotse kubika contact.";

}

};

window.chat=function(uid,name,phone){

localStorage.setItem("deppNetSelectedContactUid",uid);
localStorage.setItem("deppNetSelectedContactName",name);
localStorage.setItem("deppNetSelectedContactPhone",phone);

location.href="chat.html";
};

window.searchBox=function(){

const x=$("searchCard");

x.style.display=x.style.display=="none"?"block":"none";

if(x.style.display=="block")$("search").focus();

};

$("search").oninput=function(){

const s=this.value.toLowerCase();

render(
all.filter(x=>
String(x.name||"").toLowerCase().includes(s)||
String(x.phone||"").includes(s)
)
);

};

onAuthStateChanged(auth,u=>{

if(!u){
location.href="login.html";
return;
}

me=u;
load();

});

</script>
</body>
</html>
