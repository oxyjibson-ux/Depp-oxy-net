<!DOCTYPE html>
<html lang="rn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Depp Net - Admin</title>

<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#f2f4f7}
header{
 background:#1877f2;color:white;padding:16px;
 font-size:21px;font-weight:bold
}
.box{
 max-width:600px;margin:18px auto;background:white;
 padding:18px;border-radius:15px
}
input,textarea{
 width:100%;padding:13px;margin:7px 0;
 border:1px solid #ddd;border-radius:9px
}
button{
 width:100%;padding:13px;margin:7px 0;
 border:0;border-radius:9px;
 background:#1877f2;color:white;font-weight:bold
}
.delete{background:#e53935}
video{width:100%;border-radius:10px;margin-top:8px}
#msg{padding:10px;font-weight:bold}
.film{
 border-top:1px solid #ddd;
 padding:15px 0
}
</style>
</head>

<body>

<header>👑 Depp Net Admin</header>

<div class="box">

<h2>🎬 Gucungera Films</h2>

<p id="msg">⏳ Turiko turasuzuma account...</p>

<div id="adminBox" style="display:none">

<input id="title" placeholder="Izina rya Film">

<textarea id="desc" placeholder="Insiguro ya Film"></textarea>

<input id="file" type="file" accept="video/*">

<button id="upload">⬆️ Shiramwo Film</button>

<h3>📚 Films ziriho</h3>

<div id="list"></div>

</div>

</div>

<script type="module">

import{
 initializeApp
}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{
 getAuth,
 onAuthStateChanged
}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import{
 getFirestore,
 collection,
 addDoc,
 getDocs,
 deleteDoc,
 doc,
 serverTimestamp
}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig={
 apiKey:"AIzaSyAddn7bUZfDupIqfSvBbXRpxarFAsV2lYs",
 authDomain:"depp-net-apk.firebaseapp.com",
 projectId:"depp-net-apk",
 storageBucket:"depp-net-apk.firebasestorage.app",
 messagingSenderId:"664141462348",
 appId:"1:664141462348:web:8202143fef6fcdaf9cede9"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);


/* ADMIN */

const ADMIN_UID="J6cFfnF5XOR67T1vwtLNyaKGw1L2";
const ADMIN_EMAIL="deppoxy6@gmail.com";


/* CHECK LOGIN */

onAuthStateChanged(auth,user=>{

 if(!user){

  document.getElementById("msg").innerHTML=
  "❌ Banza winjire muri Depp Net.";

  return;
 }

 if(
   user.uid!==ADMIN_UID &&
   user.email!==ADMIN_EMAIL
 ){

  document.getElementById("msg").innerHTML=
  "❌ Iyi account si Admin.";

  return;
 }

 document.getElementById("msg").innerHTML=
 "✅ Admin yemerewe.";

 document.getElementById("adminBox").style.display="block";

 loadFilms();

});


/* UPLOAD */

document.getElementById("upload").onclick=async()=>{

 const title=document.getElementById("title").value.trim();
 const desc=document.getElementById("desc").value.trim();
 const file=document.getElementById("file").files[0];
 const msg=document.getElementById("msg");

 if(!title){
  msg.innerHTML="⚠️ Andika izina rya Film.";
  return;
 }

 if(!file){
  msg.innerHTML="⚠️ Hitamwo video.";
  return;
 }

 if(file.size>100*1024*1024){
  msg.innerHTML="❌ Video irarenze 100MB.";
  return;
 }

 msg.innerHTML="⏳ Turiko turashiramwo video...";

 try{

  /* CLOUDINARY */

  const fd=new FormData();

  fd.append("file",file);
  fd.append("upload_preset","yvgqax4x");

  const res=await fetch(
   "https://api.cloudinary.com/v1_1/sdtggm0f/video/upload",
   {
    method:"POST",
    body:fd
   }
  );

  const data=await res.json();

  if(!data.secure_url){

   throw new Error(
    data.error?.message||
    "Cloudinary yanse video."
   );

  }


  /* FIRESTORE */

  await addDoc(
   collection(db,"films"),
   {
    title:title,
    description:desc,
    video:data.secure_url,
    admin:ADMIN_UID,
    createdAt:serverTimestamp()
   }
  );


  document.getElementById("title").value="";
  document.getElementById("desc").value="";
  document.getElementById("file").value="";

  msg.innerHTML="✅ Film yashizweho neza!";

  loadFilms();

 }catch(e){

  msg.innerHTML="❌ "+e.message;

 }

};


/* LOAD FILMS */

async function loadFilms(){

 const list=document.getElementById("list");

 list.innerHTML="⏳ Turiko turarondera Films...";

 try{

  const snap=await getDocs(
   collection(db,"films")
  );

  list.innerHTML="";

  if(snap.empty){

   list.innerHTML=
   "<p>🎬 Nta Film irashirwamwo.</p>";

   return;

  }


  snap.forEach(item=>{

   const x=item.data();

   const div=document.createElement("div");

   div.className="film";

   div.innerHTML=`
    <h3>${x.title||"Film"}</h3>
    <p>${x.description||""}</p>
    <video src="${x.video}" controls></video>
    <button class="delete">
    🗑️ Siba Film
    </button>
   `;

   div.querySelector(".delete").onclick=
   async()=>{

    if(!confirm("Urashaka gusiba iyi Film?"))
     return;

    await deleteDoc(
     doc(db,"films",item.id)
    );

    loadFilms();

   };

   list.appendChild(div);

  });

 }catch(e){

  list.innerHTML=
  "❌ "+e.message;

 }

}

</script>

</body>
</html>
