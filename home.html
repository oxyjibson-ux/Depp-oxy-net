<!DOCTYPE html>
<html lang="rn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Depp Net - Home</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#f2f4f7;color:#222;padding-bottom:65px}
.dark{background:#121212;color:#eee}
.dark header,.dark .box,.dark .post,.dark .bottom,.dark .menu{background:#1e1e1e;color:#eee}
.dark button,.dark textarea,.dark input{background:#333;color:#eee;border-color:#555}
header{height:58px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 10px;position:sticky;top:0;z-index:5;border-bottom:1px solid #ddd}
.logo{font-size:20px;font-weight:bold;color:#1877f2}
.hbtn,.menu button,.action{border:0;background:#eee;border-radius:8px;padding:9px}
.top{display:flex;gap:6px}
.menu{display:none;position:absolute;right:8px;top:55px;background:#fff;padding:8px;border-radius:10px;box-shadow:0 2px 12px #bbb;z-index:9}
.menu button{display:block;width:155px;margin:4px 0;text-align:left}
main{max-width:650px;margin:auto;padding:10px}
.box,.post{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 4px #ddd}
.profile{display:flex;align-items:center;gap:10px}
.default{width:45px;height:45px;border-radius:50%;background:#1877f2;color:white;display:flex;align-items:center;justify-content:center;font-size:22px}
.pname{font-weight:bold}.puser,.time{font-size:12px;color:#777}
textarea{width:100%;min-height:65px;border:1px solid #ddd;border-radius:10px;padding:10px;resize:none}
.row,.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.row button,.send{border:0;border-radius:9px;padding:9px 12px}
.send{background:#1877f2;color:white}
.media{max-width:100%;max-height:400px;border-radius:10px;margin-top:8px}
.liked{background:#ffdede;color:red}.delete{background:#ffe1e1;color:#d00}
.comment{display:flex;gap:5px;margin-top:8px}
.comment input{flex:1;border:1px solid #ddd;border-radius:8px;padding:9px}
.onecomment{background:#f2f4f7;border-radius:9px;padding:7px;margin-top:5px;font-size:14px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px;z-index:6}
.bottom button{border:0;background:none;font-size:20px;position:relative}
.badge{position:absolute;top:-5px;right:-7px;background:red;color:white;border-radius:20px;font-size:10px;padding:3px 5px}
.stitle{display:flex;justify-content:space-between;align-items:center}
.stitle button{border:0;background:#1877f2;color:white;border-radius:8px;padding:8px}
.statuses{display:flex;gap:9px;overflow-x:auto;margin-top:10px}
.st{min-width:100px;background:#f2f4f7;border-radius:10px;padding:7px;text-align:center}
.st img,.st video{width:85px;height:105px;object-fit:cover;border-radius:8px;margin-top:5px}
.sttext{width:85px;height:105px;border-radius:8px;background:#1877f2;color:white;display:flex;align-items:center;justify-content:center;padding:7px;overflow:hidden;margin-top:5px}
</style>
</head>

<body>

<header>
<button class="hbtn" onclick="go('profile.html')">👤</button>
<div class="logo">Depp Net</div>
<div class="top">
<button class="hbtn" onclick="go('search.html')">🔎</button>
<button class="hbtn" onclick="menu()">☰</button>
</div>

<div id="m" class="menu">
<button onclick="go('chat.html')">💬 <span id="tChat">Chat</span></button>
<button onclick="go('notify.html')">🔔 <span id="tNotify">Notifications</span></button>
<button onclick="go('contacts.html')">👥 <span id="tContacts">Contacts</span></button>
<button onclick="go('settings.html')">⚙️ <span id="tSettings">Settings</span></button>
<button onclick="logout()">🚪 <span id="tLogout">Logout</span></button>
</div>
</header>

<main>

<div class="box profile">
<div class="default" id="avatar">D</div>
<div><div class="pname" id="name">...</div><div class="puser" id="user">@...</div></div>
</div>

<div class="box">
<div class="stitle">
<b>🟢 Status</b>
<button onclick="go('status.html')">＋ Add</button>
</div>
<div id="statuses">Turiko turarondera...</div>
</div>

<div class="box" id="streak" onclick="addStreak()">🔥 1 Day Streak</div>

<div class="box">
<textarea id="txt" placeholder="Andika ico ushaka gusangiza..."></textarea>
<div class="row">
<button onclick="document.getElementById('photo').click()">📷 Photo</button>
<input id="photo" type="file" accept="image/*" hidden>
<button onclick="document.getElementById('video').click()">🎬 Video</button>
<input id="video" type="file" accept="video/*" hidden>
<button class="send" onclick="post()">📤 Sangiza</button>
</div>
<div id="preview"></div>
<div id="uploadMsg"></div>
</div>

<div id="posts">Turiko turarondera Posts...</div>
</main>

<div class="bottom">
<button onclick="go('chat.html')">💬</button>
<button onclick="go('notify.html')">🔔<span id="badge" class="badge" style="display:none">0</span></button>
<button onclick="go('contacts.html')">👥</button>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{getFirestore,collection,doc,addDoc,onSnapshot,query,orderBy,serverTimestamp,updateDoc,deleteDoc,arrayUnion,arrayRemove,getDoc,setDoc}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const app=initializeApp({
apiKey:"AIzaSyAddn7bUZfDupIqfSvBbXRpxarFAsV2lYs",
authDomain:"depp-net-apk.firebaseapp.com",
projectId:"depp-net-apk",
storageBucket:"depp-net-apk.firebasestorage.app",
messagingSenderId:"664141462348",
appId:"1:664141462348:web:8202143fef6fcdaf9cede9
"});
const auth=getAuth(app),db=getFirestore(app);
const CLOUD="sdtggm0f",PRESET="yvgqax4x";
const $=id=>document.getElementById(id);

let me,posts=[],comments=[];
document.body.classList.toggle("dark",localStorage.dark==="1");

window.go=x=>location.href=x;
window.menu=()=>m.style.display=m.style.display==="block"?"none":"block";

const lang=localStorage.lang||"rn";
const L={
rn:["Chat","Notifications","Contacts","Settings","Logout"],
fr:["Discussion","Notifications","Contacts","Paramètres","Déconnexion"],
en:["Chat","Notifications","Contacts","Settings","Logout"]
}[lang]||["Chat","Notifications","Contacts","Settings","Logout"];

tChat.textContent=L[0];tNotify.textContent=L[1];tContacts.textContent=L[2];tSettings.textContent=L[3];tLogout.textContent=L[4];

onAuthStateChanged(auth,u=>{
if(!u)return location.href="login.html";
me=u;loadMe();loadPosts();loadComments();loadNotify();loadStreak();loadStatuses();
});

async function loadMe(){
let n=JSON.parse(localStorage.getItem("deppNetUser")||"{}");
name.textContent=n.name||"User";
user.textContent="@"+(n.username||me.email.split("@")[0]);
avatar.textContent=(n.name||"D")[0].toUpperCase();
}

function loadPosts(){
onSnapshot(query(collection(db,"posts"),orderBy("createdAt","desc")),s=>{
posts=s.docs.map(d=>({id:d.id,...d.data()}));showPosts();
});
}

function loadComments(){
onSnapshot(collection(db,"comments"),s=>{
comments=s.docs.map(d=>({id:d.id,...d.data()}));showPosts();
});
}

function esc(x){
let d=document.createElement("div");d.textContent=x||"";return d.innerHTML;
}

function showPosts(){
if(!posts.length)return postsBox.innerHTML="<div class='box'>Nta Posts ziraboneka.</div>";
postsBox.innerHTML=posts.map(p=>{
let liked=(p.likes||[]).includes(me.uid),cs=comments.filter(c=>c.postId===p.id),mine=p.uid===me.uid;
return`<div class="post">
<div class="profile"><div class="default">${esc((p.name||"D")[0].toUpperCase())}</div><div><b>${esc(p.name||"User")}</b><div class="puser">@${esc(p.username||"")}</div></div></div>
<div style="margin-top:10px">${esc(p.text)}</div>
${p.image?`<img class="media" src="${p.image}">`:""}
${p.video?`<video class="media" src="${p.video}" controls></video>`:""}
<div class="actions">
<button class="action ${liked?"liked":""}" onclick="likePost('${p.id}',${liked})">❤️ ${(p.likes||[]).length}</button>
<button class="action" onclick="focusComment('${p.id}')">💬 ${cs.length}</button>
<button class="action" onclick="sharePost('${p.id}')">↗</button>
${mine?`<button class="action delete" onclick="deletePost('${p.id}')">🗑️</button>`:""}
</div>
${cs.map(c=>`<div class="onecomment"><b>${esc(c.name)}</b> <small>@${esc(c.username)}</small><br>${esc(c.text)}</div>`).join("")}
<div class="comment"><input id="c${p.id}" placeholder="Andika comment..."><button class="send" onclick="comment('${p.id}')">Send</button></div>
</div>`;
}).join("");
}
const postsBox=document.getElementById("posts");

async function upload(file){
let type=file.type.startsWith("video")?"video":"image";
let f=new FormData();f.append("file",file);f.append("upload_preset",PRESET);
let r=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD}/${type}/upload`,{method:"POST",body:f});
let d=await r.json();if(!r.ok)throw Error(d.error?.message||"Upload failed");return d.secure_url;
}

window.post=async()=>{
let t=txt.value.trim(),pf=photo.files[0],vf=video.files[0];
if(!t&&!pf&&!vf)return alert("Andika Post canke hitamwo Media.");
if(pf&&vf)return alert("Hitamwo Photo canke Video imwe.");
if(pf&&pf.size>5242880)return alert("Photo ntirenge 5MB.");
if(vf&&vf.size>20971520)return alert("Video ntirenge 20MB.");
try{
let n=JSON.parse(localStorage.getItem("deppNetUser")||"{}"),im=null,vi=null;
uploadMsg.textContent="⏳ Turiko turabika...";
if(pf)im=await upload(pf);if(vf)vi=await upload(vf);
await addDoc(collection(db,"posts"),{uid:me.uid,name:n.name||"User",username:n.username||"user",text:t,image:im,video:vi,likes:[],createdAt:serverTimestamp()});
txt.value=photo.value=video.value=preview.innerHTML="";uploadMsg.textContent="✅ Vyashizweko.";
setTimeout(()=>uploadMsg.textContent="",2000);
}catch(e){alert("Post ntiyabitswe: "+e.message)}
};

photo.onchange=e=>{
let f=e.target.files[0];if(!f)return;video.value="";
if(f.size>5242880)return photo.value="",alert("Photo ntirenge 5MB.");
let r=new FileReader();r.onload=()=>preview.innerHTML=`<img class="media" src="${r.result}">`;r.readAsDataURL(f);
};

video.onchange=e=>{
let f=e.target.files[0];if(!f)return;photo.value="";
if(f.size>20971520)return video.value="",alert("Video ntirenge 20MB.");
preview.innerHTML=`<video class="media" src="${URL.createObjectURL(f)}" controls></video>`;
};

window.likePost=async(id,liked)=>{
let p=posts.find(x=>x.id===id);if(!p)return;
try{
await updateDoc(doc(db,"posts",id),{likes:liked?arrayRemove(me.uid):arrayUnion(me.uid)});
if(!liked&&p.uid!==me.uid){
let n=JSON.parse(localStorage.getItem("deppNetUser")||"{}");
await addDoc(collection(db,"notifications"),{toUid:p.uid,fromUid:me.uid,fromUsername:n.username||"user",name:n.name||"User",type:"like",postId:id,read:false,createdAt:serverTimestamp()});
}
}catch(e){alert("Like ntiyakoze.")}
};

window.comment=async id=>{
let i=$("c"+id),t=i.value.trim(),p=posts.find(x=>x.id===id);if(!t||!p)return;
let n=JSON.parse(localStorage.getItem("deppNetUser")||"{}");
try{
await addDoc(collection(db,"comments"),{postId:id,postOwner:p.uid,uid:me.uid,name:n.name||"User",username:n.username||"user",text:t,createdAt:serverTimestamp()});
if(p.uid!==me.uid)await addDoc(collection(db,"notifications"),{toUid:p.uid,fromUid:me.uid,fromUsername:n.username||"user",name:n.name||"User",type:"comment",postId:id,read:false,createdAt:serverTimestamp()});
i.value="";
}catch(e){alert("Comment ntiyabitswe.")}
};

window.focusComment=id=>{$("c"+id)?.focus()};
window.deletePost=async id=>{
let p=posts.find(x=>x.id===id);if(!p||p.uid!==me.uid)return;
if(confirm("Urashaka gusiba iyi Post?"))await deleteDoc(doc(db,"posts",id));
};

window.sharePost=async id=>{
let u=location.href+"#post-"+id;
try{if(navigator.share)await navigator.share({title:"Depp Net",text:"Raba iyi Post",url:u});else await navigator.clipboard.writeText(u)}catch(e){}
};

function loadNotify(){
onSnapshot(collection(db,"notifications"),s=>{
let n=s.docs.filter(d=>d.data().toUid===me.uid&&!d.data().read).length;
badge.textContent=n;badge.style.display=n?"block":"none";
});
}

/* STATUS */
function loadStatuses(){
onSnapshot(collection(db,"statuses"),s=>{
let now=Date.now(),a=s.docs.map(d=>({id:d.id,...d.data()}))
.filter(x=>now-(x.createdMs||0)<86400000)
.sort((a,b)=>(b.createdMs||0)-(a.createdMs||0));

if(!a.length)return statuses.innerHTML="<span class='time'>Nta Status nshasha ubu.</span>";

statuses.innerHTML=`<div class="statuses">${a.map(x=>{
let media=x.type==="image"&&x.media?`<img src="${x.media}">`:x.type==="video"&&x.media?`<video src="${x.media}" controls></video>`:x.text?`<div class="sttext">${esc(x.text)}</div>`:"";
return`<div class="st" onclick="go('status.html')"><b>${esc(x.name||"User")}</b>${media}</div>`;
}).join("")}</div>`;
});
}

/* STREAK */
async function loadStreak(){
try{
let r=doc(db,"streaks",me.uid),s=await getDoc(r),d=new Date(),today=d.toDateString(),days=1;
if(s.exists()&&s.data().lastDate===today)days=s.data().days||1;
await setDoc(r,{uid:me.uid,days,lastDate:today});streak.textContent="🔥 "+days+" Day Streak";
}catch(e){}
}

window.addStreak=async()=>{
let r=doc(db,"streaks",me.uid),s=await getDoc(r),days=s.exists()?(s.data().days||0)+1:1;
await setDoc(r,{uid:me.uid,days,lastDate:new Date().toDateString()});
streak.textContent="🔥 "+days+" Day Streak";
};

window.logout=async()=>{
try{await signOut(auth)}catch(e){}
localStorage.removeItem("deppNetLoggedIn");
localStorage.removeItem("deppNetUser");
location.href="login.html";
};
</script>
</body>
</html>
