<!DOCTYPE html>
<html lang="rn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Depp Net - Status</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#f2f4f7}
header{height:60px;background:#1877f2;color:white;display:flex;align-items:center;padding:8px}
.back{width:40px;height:40px;border:0;border-radius:50%;font-size:22px}
.logo{font-size:21px;font-weight:bold;margin-left:10px}
.box{max-width:600px;margin:auto;padding:15px}
.card,.status{background:white;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 2px 7px #ddd}
textarea{width:100%;height:80px;padding:10px;border:1px solid #ddd;border-radius:8px;resize:none}
button{border:0;border-radius:8px;padding:11px;margin-top:8px}
.add{width:100%;background:#1877f2;color:white}
.photo{background:#e8f0fe;color:#1877f2;width:100%}
.status img{width:100%;max-height:450px;object-fit:cover;border-radius:9px;margin-top:8px}
.name{font-weight:bold}
.time{font-size:12px;color:#777;margin-top:4px}
.remove{background:#ff3b30;color:white}
input[type=file]{display:none}
</style>
</head>

<body>

<header>
<button class="back" onclick="location.href='home.html'">←</button>
<div class="logo">🟢 Status</div>
</header>

<div class="box">

<div class="card">
<textarea id="text" placeholder="Andika Status yawe..."></textarea>

<input id="photoInput" type="file" accept="image/*">

<button class="photo" onclick="photoInput.click()">
📷 Shiramwo Photo
</button>

<div id="preview"></div>

<button class="add" onclick="addStatus()">
➕ Shira Status
</button>
</div>

<div id="list"></div>

</div>

<script>

if(localStorage.getItem("deppNetLoggedIn")!=="true")
location.href="login.html";

function getUser(){
try{
return JSON.parse(localStorage.getItem("deppNetUser")||"null");
}catch(e){return null}
}

let me=getUser();
let photo=null;

/* PHOTO */

photoInput.onchange=function(){

let f=this.files[0];
if(!f)return;

if(f.size>5*1024*1024){
alert("Photo ni nini cane. Hitamwo iri munsi ya 5MB.");
this.value="";
return;
}

let r=new FileReader();

r.onload=function(e){
photo=e.target.result;
preview.innerHTML=`<img src="${photo}" style="width:100%;border-radius:9px">`;
};

r.readAsDataURL(f);
};

/* STATUS */

function getStatuses(){

try{
let x=JSON.parse(localStorage.getItem("deppNetStatuses")||"[]");
return Array.isArray(x)?x:[];
}catch(e){
return [];
}

}

function addStatus(){

let t=text.value.trim();

if(!t&&!photo){
alert("Andika Status canke ushireko Photo.");
return;
}

let a=getStatuses();

a.unshift({
id:Date.now(),
name:me.name||"User",
username:me.username||"user",
text:t,
photo:photo,
created:Date.now()
});

localStorage.setItem("deppNetStatuses",JSON.stringify(a));

text.value="";
photo=null;
photoInput.value="";
preview.innerHTML="";

showStatuses();
}

/* SHOW */

function showStatuses(){

let now=Date.now();
let a=getStatuses();

/* Remove old statuses */
a=a.filter(x=>now-x.created<24*60*60*1000);

localStorage.setItem("deppNetStatuses",JSON.stringify(a));

if(!a.length){
list.innerHTML="<div class='card'>Nta Status irashirwako ubu.</div>";
return;
}

list.innerHTML=a.map(x=>{

let hours=Math.floor((now-x.created)/3600000);
let time=hours<1?"Ubu":hours+"h ago";

return `
<div class="status">

<div class="name">${esc(x.name)}</div>
<div class="time">${esc(time)} · @${esc(x.username)}</div>

${x.text?`<p>${esc(x.text)}</p>`:""}

${x.photo?`<img src="${x.photo}">`:""}

${String(x.username).toLowerCase()===
String(me.username).toLowerCase()
?`<button class="remove" onclick="removeStatus(${x.id})">❌ Kuraho</button>`
:""}

</div>
`;

}).join("");

}

/* REMOVE */

function removeStatus(id){

let a=getStatuses().filter(x=>x.id!==id);

localStorage.setItem("deppNetStatuses",JSON.stringify(a));

showStatuses();

}

/* SECURITY */

function esc(x){

let d=document.createElement("div");
d.textContent=x||"";
return d.innerHTML;

}

showStatuses();

</script>

</body>
</html>
