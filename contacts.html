<!DOCTYPE html>
<html lang="rn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Depp Net - Contacts</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#f2f4f7;color:#222}
header{height:60px;background:#1877f2;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 15px}
header b{font-size:21px}
button{border:0;border-radius:9px;padding:10px 13px;font-weight:bold}
.home{background:white;color:#1877f2}
.box{max-width:650px;margin:auto;padding:15px}
.card{background:white;border-radius:14px;padding:16px;margin-bottom:15px}
h3{margin:0 0 14px}
input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;margin-bottom:10px;font-size:15px}
.searchBtn{width:100%;background:#1877f2;color:white;font-size:16px}
.result{background:white;border-radius:12px;padding:13px;margin-top:10px;display:flex;align-items:center;gap:10px}
.avatar{width:48px;height:48px;border-radius:50%;background:#1877f2;color:white;display:grid;place-items:center;font-weight:bold;font-size:20px}
.info{flex:1}
.name{font-weight:bold}
.phone{font-size:13px;color:#777;margin-top:4px}
.chat{background:#1877f2;color:white}
.msg{text-align:center;color:#777;padding:20px}
</style>
</head>

<body>

<header>
<b>Depp Net</b>
<button class="home" onclick="location.href='home.html'">🏠 Home</button>
</header>

<div class="box">

<div class="card">
<h3>🔎 Rondera umuntu kuri Depp Net</h3>

<select id="country"></select>

<input id="phone"
type="tel"
placeholder="Numero ya telefone">

<div id="preview" style="font-size:13px;color:#777;margin-bottom:10px"></div>

<button class="searchBtn" onclick="searchUser()">
🔎 Rondera
</button>
</div>

<div class="card">
<h3>👥 Umuntu wabonetse</h3>
<div id="result" class="msg">
Andika numero kugira urondere.
</div>
</div>

</div>

<script type="module">

import{initializeApp}
from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{getAuth,onAuthStateChanged}
from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import{getFirestore,collection,query,where,getDocs}
from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const app=initializeApp({
apiKey:"AIzaSyAddn7bUZfDupIqfSvBbXRpxarFAsV2lYs",
authDomain:"depp-net-apk.firebaseapp.com",
projectId:"depp-net-apk",
storageBucket:"depp-net-apk.firebasestorage.app",
messagingSenderId:"664141462348",
appId:"1:664141462348:web:8202143fef6fcdaf9cede9"
});

const auth=getAuth(app);
const db=getFirestore(app);

const country=document.getElementById("country");
const phone=document.getElementById("phone");
const preview=document.getElementById("preview");
const result=document.getElementById("result");

let me=null;

const countries=[
["🇧🇮","Burundi","257"],["🇷🇼","Rwanda","250"],
["🇨🇩","RDC","243"],["🇹🇿","Tanzania","255"],
["🇺🇬","Ouganda","256"],["🇰🇪","Kenya","254"],
["🇿🇦","Afrique du Sud","27"],["🇳🇬","Nigeria","234"],
["🇬🇭","Ghana","233"],["🇨🇲","Cameroun","237"],
["🇨🇮","Côte d’Ivoire","225"],["🇸🇳","Sénégal","221"],
["🇲🇱","Mali","223"],["🇧🇫","Burkina Faso","226"],
["🇳🇪","Niger","227"],["🇹🇬","Togo","228"],
["🇧🇯","Bénin","229"],["🇬🇳","Guinée","224"],
["🇨🇫","RCA","236"],["🇹🇩","Tchad","235"],
["🇬🇦","Gabon","241"],["🇨🇬","Congo","242"],
["🇲🇬","Madagascar","261"],["🇲🇿","Mozambique","258"],
["🇿🇲","Zambie","260"],["🇿🇼","Zimbabwe","263"],
["🇪🇬","Égypte","20"],["🇲🇦","Maroc","212"],
["🇩🇿","Algérie","213"],["🇹🇳","Tunisie","216"],
["🇦🇪","Émirats arabes unis","971"],["🇸🇦","Arabie Saoudite","966"],
["🇶🇦","Qatar","974"],["🇰🇼","Koweït","965"],
["🇹🇷","Turquie","90"],["🇫🇷","France","33"],
["🇧🇪","Belgique","32"],["🇩🇪","Allemagne","49"],
["🇨🇭","Suisse","41"],["🇮🇹","Italie","39"],
["🇪🇸","Espagne","34"],["🇵🇹","Portugal","351"],
["🇳🇱","Pays-Bas","31"],["🇬🇧","Royaume-Uni","44"],
["🇺🇸","USA","1"],["🇨🇦","Canada","1"],
["🇧🇷","Brésil","55"],["🇲🇽","Mexique","52"],
["🇦🇷","Argentine","54"],["🇮🇳","Inde","91"],
["🇵🇰","Pakistan","92"],["🇨🇳","Chine","86"],
["🇯🇵","Japon","81"],["🇰🇷","Corée du Sud","82"],
["🇮🇩","Indonésie","62"],["🇲🇾","Malaisie","60"],
["🇸🇬","Singapour","65"],["🇦🇺","Australie","61"],
["🇳🇿","Nouvelle-Zélande","64"],["🇷🇺","Russie","7"],
["🇪🇹","Éthiopie","251"],["🇸🇴","Somalie","252"]
];

countries.forEach(c=>{
let o=document.createElement("option");
o.value=c[2];
o.textContent=`${c[0]} ${c[1]} (+${c[2]})`;
country.appendChild(o);
});

country.value="257";

function getPhone(){
let code=country.value;
let n=phone.value.replace(/\D/g,"");

if(n.startsWith("00"))n=n.slice(2);
if(n.startsWith(code))return"+"+n;
if(n.startsWith("0"))n=n.slice(1);

return"+"+code+n;
}

phone.oninput=()=>{
let p=getPhone();
preview.textContent=p.length>4?"Numero: "+p:"";
};

onAuthStateChanged(auth,u=>{
if(!u)location.href="login.html";
else me=u;
});

window.searchUser=async()=>{

if(!me)return;

let p=getPhone();

if(p.length<7){
alert("Andika numero neza.");
return;
}

result.innerHTML="⏳ Turiko turarondera...";

try{

let r=await getDocs(
query(collection(db,"users"),where("phone","==",p))
);

if(r.empty){

let noPlus=p.replace("+","");

r=await getDocs(
query(collection(db,"users"),where("phone","==",noPlus))
);
}

if(r.empty){

result.innerHTML=
"❌ Uwo muntu ntarafungura konti ya Depp Net.";

return;
}

let d=r.docs[0];

if(d.id===me.uid){

result.innerHTML="👤 Iyo ni konti yawe.";

return;
}

let u=d.data();
let name=u.name||"User";
let letter=name[0]?.toUpperCase()||"U";

result.innerHTML=`
<div class="result">
<div class="avatar">${letter}</div>
<div class="info">
<div class="name">${name}</div>
<div class="phone">📞 ${p}</div>
</div>
<button class="chat"
onclick="openChat('${d.id}','${name.replace(/'/g,"\\'")}')">
💬 Chat
</button>
</div>
`;

}catch(e){

console.error(e);

result.innerHTML=
"❌ Habaye ikibazo mu kurondera uwo muntu.";
}
};

window.openChat=(uid,name)=>{

localStorage.setItem(
"deppNetSelectedContactUid",uid
);

localStorage.setItem(
"deppNetSelectedContactName",name
);

location.href="chat.html";
};

</script>
</body>
</html>
