<!DOCTYPE html>
<html lang="rn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Depp Net - Forgot Password</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f4f7;
    color:#222;
}

header{
    background:#1877f2;
    color:white;
    text-align:center;
    padding:18px;
    font-size:25px;
    font-weight:bold;
}

.container{
    width:92%;
    max-width:420px;
    margin:40px auto;
}

.card{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

h2{
    text-align:center;
    margin-top:0;
}

p{
    text-align:center;
    color:#666;
}

input{
    width:100%;
    padding:14px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:0;
    border-radius:10px;
    background:#1877f2;
    color:white;
    font-size:17px;
    font-weight:bold;
}

#error{
    display:none;
    background:#ffe5e5;
    color:#d00000;
    padding:10px;
    border-radius:8px;
    margin-top:12px;
    text-align:center;
}

#success{
    display:none;
    background:#e4ffe8;
    color:#087a1d;
    padding:10px;
    border-radius:8px;
    margin-top:12px;
    text-align:center;
}

.links{
    text-align:center;
    margin-top:18px;
}

.links a{
    display:block;
    margin:10px;
    color:#1877f2;
    text-decoration:none;
}
</style>
</head>

<body>

<header>
    Depp Net
</header>

<div class="container">

    <div class="card">

        <h2>Wibagiye mot de passe?</h2>

        <p>
            Shiramwo email yawe hanyuma ushireho
            mot de passe nshasha.
        </p>

        <input
            type="email"
            id="email"
            placeholder="Email yawe"
            autocomplete="email"
        >

        <input
            type="password"
            id="newPassword"
            placeholder="Mot de passe mushasha"
            autocomplete="new-password"
        >

        <input
            type="password"
            id="confirmPassword"
            placeholder="Subiramwo mot de passe"
            autocomplete="new-password"
        >

        <button onclick="resetPassword()">
            Hindura mot de passe
        </button>

        <div id="error"></div>
        <div id="success"></div>

        <div class="links">

            <a href="login.html">
                Subira kuri Login
            </a>

            <a href="register.html">
                Kora account nshasha
            </a>

        </div>

    </div>

</div>

<script>

function getUsers(){

    let users = JSON.parse(
        localStorage.getItem("deppNetUsers") || "[]"
    );

    /*
      Preserve account ya kera niba iriho.
    */

    const oldUser = localStorage.getItem("deppNetUser");

    if(users.length === 0 && oldUser){

        try{

            const user = JSON.parse(oldUser);

            if(user && user.email){

                users.push(user);

                localStorage.setItem(
                    "deppNetUsers",
                    JSON.stringify(users)
                );

            }

        }catch(e){

            console.log("Old account migration failed");

        }
    }

    return users;
}


function resetPassword(){

    const email = document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();

    const newPassword =
        document.getElementById("newPassword").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const error =
        document.getElementById("error");

    const success =
        document.getElementById("success");

    error.style.display = "none";
    success.style.display = "none";


    if(!email || !newPassword || !confirmPassword){

        error.textContent =
            "Uzuza ibisabwa vyose.";

        error.style.display = "block";

        return;
    }


    if(newPassword.length < 6){

        error.textContent =
            "Mot de passe utegerezwa kuba n'imibare canke inyuguti 6 canke zirenga.";

        error.style.display = "block";

        return;
    }


    if(newPassword !== confirmPassword){

        error.textContent =
            "Mot de passe ntizihuye.";

        error.style.display = "block";

        return;
    }


    const users = getUsers();


    const index = users.findIndex(function(user){

        return String(user.email).toLowerCase() === email;

    });


    if(index === -1){

        error.textContent =
            "Nta account ibonetse ikoresha iyo email.";

        error.style.display = "block";

        return;
    }


    /*
      Duhindura password y'iyo account GUSA.
      Izindi accounts ntizihinduka.
    */

    users[index].password = newPassword;


    localStorage.setItem(
        "deppNetUsers",
        JSON.stringify(users)
    );


    /*
      Ntiduhita twinjiza account.
      Umuntu aca asubira kuri Login.
    */

    localStorage.removeItem("deppNetLoggedIn");


    success.textContent =
        "Mot de passe yahinduwe neza. Ubu ushobora kwinjira.";

    success.style.display = "block";


    document.getElementById("email").value = "";
    document.getElementById("newPassword").value = "";
    document.getElementById("confirmPassword").value = "";


    setTimeout(function(){

        window.location.href = "login.html";

    },1500);

}

</script>

</body>
</html>
