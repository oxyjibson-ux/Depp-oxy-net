<!DOCTYPE html>
<html lang="rn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Depp Net - Admin Films</title>
<style>
body{font-family:Arial;background:#f2f4f7;margin:0;padding:20px}
.box{max-width:600px;margin:auto;background:#fff;padding:20px;border-radius:15px}
input,textarea,button{width:100%;padding:13px;margin:7px 0;box-sizing:border-box}
button{border:0;border-radius:8px;background:#1877f2;color:white;font-weight:bold}
video{width:100%;margin-top:10px;border-radius:10px}
</style>
</head>

<body>
<div class="box">
<h2>🎬 Admin Films</h2>

<div id="admin">
<input id="title" placeholder="Izina rya Film">
<textarea id="desc" placeholder="Insiguro"></textarea>
<input id="file" type="file" accept="video/*">
<button id="send">⬆️ Shiramwo Film</button>
</div>

<p id="msg">⏳ Turiko turasuzuma Admin...</p>
<div id="films"></div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{getFirestore,collection,addDoc,getDocs,deleteDoc,doc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const app=initializeApp({
apiKey:"AIzaSyAddn7bUZfDupIqfSvBbXRpxarFAsV2lYs",
authDomain:"depp-net-apk.firebaseapp.com",
projectId:"depp-net-apk",
storageBucket:"depp-net-apk.firebasestorage.app",
messagingSenderId:"664141462348",
appId:"1:664141462348:web:8202143fef6fcdaf9cede9"
});

const auth=getAuth(app);
const db=getFirestore(app);

const ADMIN_UID="J6cFfnF5XOR67T1vwtLNyaKGw1L2";
const ADMIN_EMAIL="deppoxy6@gmail.com";

onAuthStateChanged(auth,u=>{
 if(!u){
  document.getElementById("msg").textContent="❌ Ntiwinjiye. Banza winjire.";
  return;
 }

 if(u.uid!==ADMIN_UID && u.email!==ADMIN_EMAIL){
  document.getElementById("admin").style.display="none";
  document.getElementById("msg").textContent="❌ Iyi account si Admin.";
  return;
 }

 document.getElementById("msg").textContent="✅ Admin yemerewe.";
 loadFilms();
});

document.getElementById("send").onclick=async()=>{
 const title=document.getElementById("title").value.trim();
 const desc=document.getElementById("desc").value.trim();
 const file=document.getElementById("file").files[0];
 const msg=document.getElementById("msg");

 if(!title||!file){
  msg.textContent="⚠️ Andika izina rya Film uhitemwo video.";
  return;
 }

 if(file.size>100*1024*1024){
  msg.textContent="❌ Video irarenze 100MB.";
  return;
 }

 msg.textContent="⏳ Turiko turashiramwo Film...";

 try{
  const fd=new FormData();
  fd.append("file",file);
  fd.append("upload_preset","yvgqax4x");

  const r=await fetch(
   "https://api.cloudinary.com/v1_1/sdtggm0f/video/upload",
   {method:"POST",body:fd}
  );

  const x=await r.json();

  if(!x.secure_url)
   throw new Error(x.error?.message||"Cloudinary yanse video.");

  await addDoc(collection(db,"films"),{
   title:title,
   description:desc,
   video:x.secure_url,
   createdAt:serverTimestamp(),
   admin:ADMIN_UID
  });

  msg.textContent="✅ Film yashizweho!";
  document.getElementById("title").value="";
  document.getElementById("desc").value="";
  document.getElementById("file").value="";
  loadFilms();

 }catch(e){
  msg.textContent="❌ "+e.message;
 }
};

async function loadFilms(){
 const box=document.getElementById("films");

 try{
  const s=await getDocs(collection(db,"films"));
  box.innerHTML="";

  if(s.empty){
   box.innerHTML="<p>🎬 Nta Film irashirwamwo.</p>";
   return;
  }

  s.forEach(d=>{
   const x=d.data();
   box.innerHTML+=`
   <div style="border-top:1px solid #ddd;padding:15px 0">
   <h3>${x.title||"Film"}</h3>
   <p>${x.description||""}</p>
   <video src="${x.video}" controls></video>
   <button onclick="removeFilm('${d.id}')">🗑️ Siba</button>
   </div>`;
  });
 }catch(e){
  box.innerHTML="❌ "+e.message;
 }
}

window.removeFilm=async id=>{
 if(confirm("Siba iyi Film?")){
  await deleteDoc(doc(db,"films",id));
  loadFilms();
 }
};
</script>
</body>
</html>
