<!DOCTYPE html><html lang="rn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Depp Net - Search</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#f1f3f6;color:#222}
header{height:62px;background:#1877f2;color:#fff;display:flex;align-items:center;padding:0 12px;position:sticky;top:0;z-index:5;box-shadow:0 2px 7px #bbb}
.back{width:42px;height:42px;border:0;border-radius:50%;background:#fff;color:#1877f2;font-size:23px}
.title{font-size:20px;font-weight:bold;margin-left:12px}
main{max-width:650px;margin:auto;padding:15px}
.searchbox{background:#fff;padding:12px;border-radius:15px;display:flex;gap:8px;box-shadow:0 2px 7px #ddd}
.searchbox input{flex:1;border:0;background:#f0f2f5;border-radius:11px;padding:13px;font-size:15px;outline:none}
.searchbox button{border:0;background:#1877f2;color:#fff;border-radius:11px;width:48px;font-size:19px}
#message{text-align:center;color:#777;font-size:14px;padding:20px 5px}
.card{background:#fff;border-radius:15px;padding:14px;margin-bottom:11px;box-shadow:0 2px 7px #ddd}
.user{display:flex;align-items:center;gap:12px}
.avatar{width:56px;height:56px;border-radius:50%;background:#e8f0fe;display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.info{flex:1}
.name{font-size:16px;font-weight:bold}
.username{color:#777;font-size:13px;margin-top:4px}
.buttons{display:flex;gap:8px;margin-top:12px}
.buttons button{flex:1;border:0;border-radius:9px;padding:10px;font-size:14px}
.chat{background:#1877f2;color:#fff}
.profile{background:#e9eaed;color:#222}
.empty{background:#fff;border-radius:15px;padding:25px;text-align:center;color:#777;box-shadow:0 2px 7px #ddd}
body.dark{background:#18191a;color:#eee}
body.dark .searchbox,body.dark .card,body.dark .empty{background:#242526;box-shadow:none}
body.dark .searchbox input{background:#18191a;color:#fff}
body.dark .profile{background:#3a3b3c;color:#fff}
body.dark .username{color:#aaa}
</style>
</head><body><header>
<button class="back" onclick="location.href='home.html'">←</button>
<div class="title">🔎 Search</div>
</header><main><div class="searchbox">
<input id="q" placeholder="Rondera umuntu...">
<button onclick="searchUsers()">🔎</button>
</div><div id="message">Andika izina canke username kugira urondere.</div>
<div id="results"></div></main><script>
if(localStorage.getItem("deppNetLoggedIn")!=="true"){
location.href="login.html";
}

function getUsers(){
try{
let x=JSON.parse(localStorage.getItem("deppNetUsers")||"[]");
return Array.isArray(x)?x:[];
}catch(e){return []}
}

function getMe(){
try{
return JSON.parse(localStorage.getItem("deppNetUser")||"null");
}catch(e){return null}
}

function esc(x){
let d=document.createElement("div");
d.textContent=x||"";
return d.innerHTML;
}

function searchUsers(){
let q=document.getElementById("q").value.trim().toLowerCase();
let results=document.getElementById("results");
let message=document.getElementById("message");

if(!q){
results.innerHTML="";
message.textContent="Andika izina canke username kugira urondere.";
return;
}

let list=getUsers();
let me=getMe();

if(me){
let has=list.some(x=>
String(x.username||"").toLowerCase()===
String(me.username||"").toLowerCase()
);
if(!has)list.push(me);
}

let found=list.filter(x=>
String(x.name||"").toLowerCase().includes(q)||
String(x.username||"").toLowerCase().includes(q)
);

if(!found.length){
message.textContent="";
results.innerHTML="<div class='empty'>😔<br><br>Nta muntu abonetse.</div>";
return;
}

message.textContent=found.length+" umuntu yabonetse.";

results.innerHTML=found.map(x=>{
let photo=x.photo?
`<img src="${esc(x.photo)}">`:"👤";

return`
<div class="card">
<div class="user">

<div class="avatar">${photo}</div>

<div class="info">
<div class="name">${esc(x.name||"User")}</div>
<div class="username">@${esc(x.username||"user")}</div>
</div>

</div>

<div class="buttons">
<button class="chat"
onclick="openChat('${esc(x.username||"")}')">
💬 Chat
</button>

<button class="profile"
onclick="openProfile('${esc(x.username||"")}')">
👤 Profile
</button>
</div>

</div>`;
}).join("");
}

function openChat(username){
localStorage.setItem("deppChatUser",username);
location.href="chat.html";
}

function openProfile(username){
localStorage.setItem("deppViewProfile",username);
location.href="profile.html";
}

document.getElementById("q").addEventListener("keydown",function(e){
if(e.key==="Enter")searchUsers();
});

if(localStorage.getItem("deppNetDarkMode")==="true"){
document.body.classList.add("dark");
}
</script></body>
</html>
