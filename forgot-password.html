<!DOCTYPE html>
<html lang="rn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Depp Net - Forgot Password</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial;
 background:#f2f4f7;
}
header{
 background:#1877f2;
 color:white;
 text-align:center;
 padding:20px;
 font-size:27px;
 font-weight:bold;
}
.box{
 width:92%;
 max-width:420px;
 margin:50px auto;
}
.card{
 background:white;
 padding:25px;
 border-radius:16px;
 box-shadow:0 3px 12px #ccc;
}
h2{text-align:center}
input{
 width:100%;
 padding:14px;
 margin:8px 0;
 border:1px solid #ccc;
 border-radius:10px;
 font-size:16px;
}
button{
 width:100%;
 padding:14px;
 margin-top:10px;
 border:0;
 border-radius:10px;
 background:#1877f2;
 color:white;
 font-size:16px;
 font-weight:bold;
}
#msg{
 margin-top:15px;
 text-align:center;
 font-size:14px;
}
a{
 display:block;
 text-align:center;
 margin-top:18px;
 color:#1877f2;
 text-decoration:none;
}
</style>
</head>

<body>

<header>Depp Net</header>

<div class="box">
<div class="card">

<h2>🔑 Wibagiye Password?</h2>

<p style="text-align:center;color:#666">
Andika Email yawe. Turakurungikira link yo guhindura password.
</p>

<input
 id="email"
 type="email"
 placeholder="Andika Email yawe"
>

<button id="btn" onclick="resetPassword()">
📧 Rungika Link
</button>

<div id="msg"></div>

<a href="login.html">⬅️ Subira kuri Login</a>

</div>
</div>

<script type="module">

import{initializeApp}from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{
getAuth,
sendPasswordResetEmail
}from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const firebaseConfig={
apiKey:"AIzaSyAddn7bUZfDupIqfSvBbXRpxarFAsV2lYs",
authDomain:"depp-net-apk.firebaseapp.com",
databaseURL:"https://depp-net-apk-default-rtdb.firebaseio.com",
projectId:"depp-net-apk",
storageBucket:"depp-net-apk.firebasestorage.app",
messagingSenderId:"664141462348",
appId:"1:664141462348:web:8202143fef6fcdaf9cede9",
measurementId:"G-DMBZT3C6MK"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);

window.resetPassword=async function(){

const email=document.getElementById("email").value.trim();
const msg=document.getElementById("msg");
const btn=document.getElementById("btn");

msg.textContent="";

if(!email){
msg.style.color="red";
msg.textContent="Andika Email yawe.";
return;
}

btn.disabled=true;
btn.textContent="Turiko turarungika...";

try{

await sendPasswordResetEmail(auth,email);

msg.style.color="green";
msg.textContent=
"✅ Link yarungitswe kuri Email yawe. Raba muri Inbox canke Spam.";

btn.textContent="📧 Rungika Link";

}catch(e){

console.log(e);

if(e.code==="auth/user-not-found"){
msg.textContent="Iyo Email nta konti ifise.";
}
else if(e.code==="auth/invalid-email"){
msg.textContent="Email siyo.";
}
else{
msg.textContent="Habaye ikibazo. Ongera ugerageze.";
}

msg.style.color="red";
btn.disabled=false;
btn.textContent="📧 Rungika Link";

}

};

</script>

</body>
</html>
