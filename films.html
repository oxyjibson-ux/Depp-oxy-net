<!DOCTYPE html>
<html lang="rn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Depp Net - Films</title>

<script src="https://upload-widget.cloudinary.com/latest/global/all.js"></script>

<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#f2f4f7}
header{
 background:#1877f2;color:white;padding:16px;
 font-size:21px;font-weight:bold
}
.box{max-width:650px;margin:auto;padding:15px}
.card{
 background:white;padding:15px;margin:12px 0;
 border-radius:14px
}
input,textarea,button{
 width:100%;padding:12px;margin:6px 0;
 border-radius:8px
}
input,textarea{border:1px solid #ddd}
button{
 border:0;background:#1877f2;
 color:white;font-weight:bold
}
.red{background:#e53935}
video{width:100%;border-radius:10px;margin-top:8px}
#admin{display:none}
#status{font-weight:bold}
#widgetBox{margin-top:10px}
</style>
</head>

<body>

<header>🎬 Depp Net Films</header>

<div class="box">

<!-- ADMIN -->
<div id="admin" class="card">

<h2>👑 Admin - Shiramwo Film</h2>

<input id="title" placeholder="Izina rya Film">

<textarea id="desc"
placeholder="Insiguro ya Film"></textarea>

<button id="uploadBtn">
🎥 Hitamwo Film
</button>

<p id="status"></p>

<div id="widgetBox"></div>

</div>


<!-- SEARCH -->
<div class="card">

<input id="search"
placeholder="🔎 Rondera Film...">

</div>


<!-- FILMS -->
<div id="list">
⏳ Turiko turarondera Films...
</div>

</div>


<script type="module">

import{initializeApp}
from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{
getAuth,
onAuthStateChanged
}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import{
getFirestore,
collection,
getDocs,
addDoc,
deleteDoc,
doc,
serverTimestamp
}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig={
apiKey:"AIzaSyAddn7bUZfDupIqfSvBbXRpxarFAsV2lYs",
authDomain:"depp-net-apk.firebaseapp.com",
projectId:"depp-net-apk",
storageBucket:"depp-net-apk.firebasestorage.app",
messagingSenderId:"664141462348",
appId:"1:664141462348:web:8202143fef6fcdaf9cede9"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);


/* ADMIN */

const ADMIN_UID=
"J6cFfnF5XOR67T1vwtLNyaKGw1L2";

const ADMIN_EMAIL=
"deppoxy6@gmail.com";

let isAdmin=false;
let films=[];


/* AUTH */

onAuthStateChanged(auth,user=>{

 if(user){

  if(
   user.uid===ADMIN_UID ||
   user.email===ADMIN_EMAIL
  ){

   isAdmin=true;

   document.getElementById("admin")
   .style.display="block";

   document.getElementById("status")
   .textContent="✅ Admin yemerewe.";

  }

 }else{

  document.getElementById("status")
  .textContent="";

 }

 loadFilms();

});


/* CLOUDINARY WIDGET */

const widget=cloudinary.createUploadWidget({

 cloudName:"sdtggm0f",

 uploadPreset:"yvgqax4x",

 resourceType:"video",

 multiple:false,

 maxFileSize:3*1024*1024*1024,

 maxChunkSize:20000000,

 clientAllowedFormats:["video"],

 sources:["local"],

 singleUploadAutoClose:true

},async(error,result)=>{

 if(error){

  document.getElementById("status")
  .textContent=
  "❌ "+(error.message||"Upload yanse.");

  return;
 }


 if(result && result.event==="upload-added"){

  document.getElementById("status")
  .textContent=
  "⏳ Video yatanguye gushirwa...";

 }


 if(result && result.event==="queues-start"){

  document.getElementById("status")
  .textContent=
  "⏳ Video iriko irashirwa kuri Cloudinary. Ntufunge page.";

 }


 if(result && result.event==="success"){

  const info=result.info;

  const title=
   document.getElementById("title")
   .value.trim();

  const desc=
   document.getElementById("desc")
   .value.trim();


  if(!title){

   document.getElementById("status")
   .textContent=
   "❌ Andika izina rya Film.";

   return;
  }


  try{

   document.getElementById("status")
   .textContent=
   "⏳ Video yarangiye. Turiko tuyibika...";


   await addDoc(
    collection(db,"films"),
    {
     title:title,
     description:desc,
     video:info.secure_url,
     publicId:info.public_id||"",
     size:info.bytes||0,
     format:info.format||"",
     admin:ADMIN_UID,
     createdAt:serverTimestamp()
    }
   );


   document.getElementById("title").value="";
   document.getElementById("desc").value="";


   document.getElementById("status")
   .textContent=
   "✅ Film yashizweho neza!";


   loadFilms();

  }catch(e){

   document.getElementById("status")
   .textContent=
   "❌ Firebase: "+e.message;

  }

 }

});


/* OPEN UPLOAD */

document.getElementById("uploadBtn")
.onclick=()=>{

 const title=
  document.getElementById("title")
  .value.trim();

 if(!title){

  document.getElementById("status")
  .textContent=
  "⚠️ Banza wandike izina rya Film.";

  return;
 }

 document.getElementById("status")
 .textContent=
 "⏳ Hitamwo video...";

 widget.open();

};


/* SEARCH */

document.getElementById("search")
.addEventListener("input",showFilms);


/* LOAD FILMS */

async function loadFilms(){

 try{

  const snap=
   await getDocs(
    collection(db,"films")
   );

  films=[];

  snap.forEach(d=>{

   films.push({
    id:d.id,
    ...d.data()
   });

  });

  showFilms();

 }catch(e){

  document.getElementById("list")
  .innerHTML=
  "❌ "+e.message;

 }

}


/* SHOW FILMS */

function showFilms(){

 const q=
  document.getElementById("search")
  .value.toLowerCase();

 const box=
  document.getElementById("list");


 const arr=films.filter(x=>
  (x.title||"")
  .toLowerCase()
  .includes(q)
 );


 if(!arr.length){

  box.innerHTML=
  "<div class='card'>🎬 Nta Film irajako.</div>";

  return;
 }


 box.innerHTML="";


 arr.forEach(x=>{

  const div=
   document.createElement("div");

  div.className="card";


  let size="";

  if(x.size){

   if(x.size>=1024*1024*1024){

    size=
     (x.size/
      (1024*1024*1024))
     .toFixed(2)+" GB";

   }else{

    size=
     (x.size/
      (1024*1024))
     .toFixed(1)+" MB";

   }

  }


  div.innerHTML=`

   <h2>🎬 ${x.title||"Film"}</h2>

   <p>${x.description||""}</p>

   ${size?
   `<small>📦 ${size}</small>`:""}

   <video
    src="${x.video}"
    controls
    preload="metadata">
   </video>

   <a
    href="${x.video}"
    target="_blank"
    style="text-decoration:none">

    <button>
     ⬇️ Fungura / Download
    </button>

   </a>
  `;


  if(isAdmin){

   const del=
    document.createElement("button");

   del.className="red";

   del.textContent=
    "🗑️ Siba Film";


   del.onclick=async()=>{

    if(!confirm(
     "Urashaka gusiba iyi Film?"
    ))return;


    try{

     await deleteDoc(
      doc(db,"films",x.id)
     );

     loadFilms();

    }catch(e){

     alert(e.message);

    }

   };


   div.appendChild(del);

  }


  box.appendChild(div);

 });

}

</script>

</body>
 </html>
