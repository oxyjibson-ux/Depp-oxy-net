<!DOCTYPE html>
<html lang="rn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Depp Net - Search</title>

<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#f2f4f7}
header{height:60px;background:#1877f2;color:white;display:flex;align-items:center;padding:8px}
.back{width:40px;height:40px;border:0;border-radius:50%;font-size:22px}
.logo{font-size:21px;font-weight:bold;margin-left:10px}
.box{max-width:600px;margin:auto;padding:15px}
.search{display:flex;gap:7px}
.search input{flex:1;padding:13px;border:1px solid #ddd;border-radius:9px;font-size:15px}
.search button{border:0;background:#1877f2;color:white;border-radius:9px;padding:12px 16px}
.result{background:white;margin-top:10px;padding:13px;border-radius:10px;display:flex;align-items:center;gap:10px}
.photo{width:55px;height:55px;border-radius:50%;object-fit:cover;background:#e8f0fe}
.default{width:55px;height:55px;border-radius:50%;background:#e8f0fe;display:flex;align-items:center;justify-content:center;font-size:28px}
.name{font-weight:bold}
.user{color:#777;font-size:13px}
</style>
</head>

<body>

<header>
<button class="back" onclick="history.back()">←</button>
<div class="logo">🔎 Search</div>
</header>

<div class="box">

<div class="search">
<input id="q" placeholder="Rondera izina canke username...">
<button onclick="search()">Search</button>
</div>

<div id="results"></div>

</div>

<script>

if(localStorage.getItem("deppNetLoggedIn")!=="true")
location.href="login.html";

function users(){

try{
let x=JSON.parse(localStorage.getItem("deppNetUsers")||"[]");
return Array.isArray(x)?x:[];
}catch(e){
return [];
}

}

function search(){

let q=document.getElementById("q").value.trim().toLowerCase();

if(!q){
results.innerHTML="<p>Andika ico ushaka kurondera.</p>";
return;
}

let me;

try{
me=JSON.parse(localStorage.getItem("deppNetUser")||"null");
}catch(e){me=null}

let list=users();

if(me){
let exists=list.some(x=>
String(x.username||"").toLowerCase()===
String(me.username||"").toLowerCase()
);

if(!exists)list.push(me);
}

let found=list.filter(x=>
String(x.name||"").toLowerCase().includes(q)||
String(x.username||"").toLowerCase().includes(q)
);

if(!found.length){
results.innerHTML="<div class='result'>Nta muntu abonetse.</div>";
return;
}

results.innerHTML=found.map(x=>`

<div class="result">
${x.photo
?`<img class="photo" src="${x.photo}">`
:`<div class="default">👤</div>`}

<div>
<div class="name">${esc(x.name||"User")}</div>
<div class="user">@${esc(x.username||"user")}</div>
</div>
</div>

`).join("");

}

function esc(x){

let d=document.createElement("div");
d.textContent=x||"";
return d.innerHTML;

}

q.addEventListener("keydown",function(e){
if(e.key==="Enter")search();
});

</script>

</body>
</html>
