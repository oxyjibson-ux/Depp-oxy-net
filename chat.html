<!DOCTYPE html>
<html lang="rn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Depp Net Chat</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#eef2f7}
header{height:55px;background:#1877f2;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 10px}
button{border:0;border-radius:20px;padding:9px 13px}
#users{padding:10px}
.user{background:white;padding:12px;margin:8px 0;border-radius:15px;display:flex;align-items:center;gap:10px}
.av{width:45px;height:45px;border-radius:50%;background:#1877f2;color:white;display:grid;place-items:center;font-weight:bold}
.info{flex:1}
#chat{display:none;height:calc(100vh - 55px)}
.top{height:58px;background:white;display:flex;align-items:center;gap:8px;padding:7px}
#msgs{height:calc(100% - 115px);overflow:auto;padding:10px}
.msg{max-width:75%;padding:10px 13px;margin:6px 0;background:white;border-radius:16px}
.mine{margin-left:auto;background:#1877f2;color:white}
.send{height:57px;background:white;display:flex;gap:5px;padding:8px}
#txt{flex:1;border:1px solid #ddd;border-radius:22px;padding:10px;outline:0}
</style>
</head>

<body>

<header>
<button onclick="goBack()">←</button>
<b>Depp Net</b>
<button onclick="location.href='home.html'">⌂</button>
</header>

<div id="users">Turiko turarondera...</div>

<div id="chat">

<div class="top">
<button onclick="goBack()">←</button>
<div class="av" id="avatar">U</div>
<div class="info"><b id="chatName">User</b></div>
</div>

<div id="msgs"></div>

<div class="send">
<input id="txt" placeholder="Andika ubutumwa...">
<button onclick="send()">➤</button>
</div>

</div>

<script type="module">

import{initializeApp}
from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{
getAuth,
onAuthStateChanged,
setPersistence,
browserLocalPersistence
}
from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import{
getFirestore,
collection,
addDoc,
onSnapshot,
query,
orderBy,
serverTimestamp
}
from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const app=initializeApp({

apiKey:"AIzaSyAddn7bUZfDupIqfSvBbXRpxarFAsV2lYs",
authDomain:"depp-net-apk.firebaseapp.com",
projectId:"depp-net-apk",
storageBucket:"depp-net-apk.firebasestorage.app",
messagingSenderId:"664141462348",
appId:"1:664141462348:web:8202143fef6fcdaf9cede9"

});

const auth=getAuth(app);
const db=getFirestore(app);

await setPersistence(auth,browserLocalPersistence);

let me=null;
let other=null;
let chatId=null;
let stopMessages=null;


onAuthStateChanged(auth,user=>{

if(!user){
location.href="login.html";
return;
}

me=user;
loadUsers();

});


function loadUsers(){

onSnapshot(collection(db,"users"),snap=>{

const box=document.getElementById("users");
box.innerHTML="";

snap.forEach(d=>{

if(d.id===me.uid)return;

const u={uid:d.id,...d.data()};

const div=document.createElement("div");
div.className="user";

div.innerHTML=`
<div class="av">
${(u.name||"U").charAt(0).toUpperCase()}
</div>

<div class="info">
<b>${u.name||"User"}</b><br>
<small>@${u.username||""}</small>
</div>
`;

div.onclick=()=>openChat(u);

box.appendChild(div);

});

if(!box.innerHTML)
box.innerHTML="<p>Nta bandi bakoresha Depp Net ubu.</p>";

});

}


function openChat(u){

other=u;

chatId=[me.uid,other.uid].sort().join("_");

document.getElementById("users").style.display="none";
document.getElementById("chat").style.display="block";

document.getElementById("chatName").textContent=
other.name||"User";

document.getElementById("avatar").textContent=
(other.name||"U").charAt(0).toUpperCase();

loadMessages();

}


function loadMessages(){

if(stopMessages)stopMessages();

const q=query(
collection(db,"chats",chatId,"messages"),
orderBy("createdAt")
);

stopMessages=onSnapshot(q,snap=>{

const box=document.getElementById("msgs");
box.innerHTML="";

snap.forEach(d=>{

const x=d.data();

const div=document.createElement("div");

div.className=
"msg "+(x.uid===me.uid?"mine":"");

div.textContent=x.text||"";

box.appendChild(div);

});

box.scrollTop=box.scrollHeight;

});

}


window.send=async()=>{

const input=document.getElementById("txt");
const text=input.value.trim();

if(!text||!other)return;

await addDoc(
collection(db,"chats",chatId,"messages"),
{
uid:me.uid,
toUid:other.uid,
text:text,
createdAt:serverTimestamp()
}
);

input.value="";

};


window.goBack=()=>{

if(document.getElementById("chat").style.display==="block"){

if(stopMessages)stopMessages();

document.getElementById("chat").style.display="none";
document.getElementById("users").style.display="block";

}else{

location.href="home.html";

}

};

</script>

</body>
</html>
