<!DOCTYPE html>
<html lang="rn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Depp Net Chat</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#eef2f7}
header{height:56px;background:#1877f2;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 10px}
button{border:0;border-radius:20px;padding:9px 12px}
header b{font-size:20px}
#users{padding:10px}
.user{background:#fff;margin:8px 0;padding:11px;border-radius:15px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 7px #ddd}
.av{width:44px;height:44px;border-radius:50%;background:#1877f2;color:#fff;display:grid;place-items:center;font-weight:bold}
.info{flex:1}.on{color:#16a34a;font-size:12px}.off{color:#888;font-size:12px}
#chat{display:none;height:calc(100vh - 56px);background:#eef2f7}
.top{height:58px;background:#fff;display:flex;align-items:center;gap:8px;padding:7px;border-bottom:1px solid #ddd}
#msgs{height:calc(100% - 125px);overflow:auto;padding:10px}
.m{max-width:78%;width:max-content;padding:9px 12px;margin:6px 0;background:#fff;border-radius:16px;box-shadow:0 1px 3px #ddd}
.mine{margin-left:auto;background:#1877f2;color:#fff}
.typ{height:20px;padding-left:12px;color:#777;font-size:12px}
.send{height:67px;background:#fff;display:flex;gap:5px;padding:8px}
#txt{flex:1;border:1px solid #ddd;border-radius:22px;padding:10px;outline:0}
.rec{background:#e53935;color:#fff}
#call,#incoming{display:none;position:fixed;inset:0;z-index:20;background:#111}
#remote{width:100%;height:100%;object-fit:cover}
#local{position:absolute;right:10px;top:65px;width:110px;height:155px;object-fit:cover;border:2px solid #fff;border-radius:12px}
.controls{position:absolute;bottom:25px;width:100%;text-align:center}
.controls button{font-size:20px;width:52px;height:52px;margin:4px}
#incoming{z-index:30;color:#fff;text-align:center;padding-top:30vh}
#incoming button{margin:8px}
</style>
</head>
<body>

<header>
<button onclick="back()">←</button><b>Depp Net</b>
<button onclick="location.href='home.html'">⌂</button>
</header>

<div id="users">Turiko turarondera...</div>
<div id="net" style="display:none;text-align:center;padding:7px;font-size:13px"></div>

<div id="chat">
<div class="top">
<button onclick="back()">←</button>
<div class="av" id="av">U</div>
<div class="info"><b id="name">User</b><br><small id="status">Offline</small></div>
<button onclick="makeCall('audio')">📞</button>
<button onclick="makeCall('video')">📹</button>
</div>
<div id="msgs"></div>
<div id="typing" class="typ"></div>
<div class="send">
<button class="rec" id="rec" onclick="record()">🎙️</button>
<input id="txt" placeholder="Andika ubutumwa...">
<button onclick="send()">➤</button>
</div>
</div>

<div id="call">
<video id="remote" autoplay playsinline></video>
<video id="local" autoplay muted playsinline></video>
<div class="controls">
<button onclick="toggleMic()">🎤</button>
<button onclick="toggleCam()">📷</button>
<button onclick="endCall()">📕</button>
</div>
</div>

<div id="incoming">
<h2>📞 Call iraje</h2>
<p id="ctype"></p>
<button onclick="answer()">✅ Kwakira</button>
<button onclick="reject()">❌ Kwanka</button>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{getFirestore,collection,doc,getDoc,setDoc,addDoc,onSnapshot,query,orderBy,serverTimestamp,updateDoc,arrayUnion,enableIndexedDbPersistence}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const app=initializeApp({
apiKey:"AIzaSyAddn7bUZfDupIqfSvBbXRpxarFAsV2lYs",
authDomain:"depp-net-apk.firebaseapp.com",
projectId:"depp-net-apk",
storageBucket:"depp-net-apk.firebasestorage.app",
messagingSenderId:"664141462348",
appId:"1:664141462348:web:8202143fef6fcdaf9cede9"
});
const auth=getAuth(app),db=getFirestore(app);

enableIndexedDbPersistence(db).catch(e=>{
console.log("Offline cache:",e.code);
});
let me,to,chatId,pc,stream,callId,incoming,recorder,chunks=[];
const ice={iceServers:[{urls:"stun:stun.l.google.com:19302"}]};
const $=id=>document.getElementById(id);
  function net(){
let n=document.getElementById("net");
if(!n)return;
n.textContent=navigator.onLine?
"🟢 Online":"📴 Offline — ubutumwa burabikwa kuri telefone";
n.style.display="block";
n.style.background=navigator.onLine?"#d1fae5":"#fff3cd";
}
addEventListener("online",net);
addEventListener("offline",net);
net();

onAuthStateChanged(auth,u=>{
if(!u)return location.href="login.html";
me=u;setPresence(true);loadUsers();watchIncoming();
});

async function setPresence(x){
await setDoc(doc(db,"presence",me.uid),{online:x,lastSeen:serverTimestamp()},{merge:true});
}

function loadUsers(){
onSnapshot(collection(db,"users"),snap=>{
$("users").innerHTML="";
snap.forEach(d=>{
if(d.id===me.uid)return;
let u={uid:d.id,...d.data()},box=document.createElement("div");
box.className="user";
box.innerHTML=`<div class="av">${(u.name||"U")[0]}</div>
<div class="info"><b>${u.name||"User"}</b><br><small>@${u.username||""}</small></div>
<span id="p${u.uid}" class="off">● Offline</span>`;
box.onclick=()=>openChat(u);
$("users").appendChild(box);
onSnapshot(doc(db,"presence",u.uid),p=>{
let x=p.data()||{},e=$("p"+u.uid);
if(e){e.className=x.online?"on":"off";e.textContent=x.online?"● Online":"● Offline"}
});
});
});
}

async function openChat(u){
to=u;
chatId=[me.uid,to.uid].sort().join("_");
$("users").style.display="none";
$("chat").style.display="block";
$("name").textContent=to.name||"User";
$("av").textContent=(to.name||"U")[0];
loadMessages();
watchTyping();
}

function loadMessages(){
onSnapshot(query(collection(db,"chats",chatId,"messages"),orderBy("createdAt")),s=>{
$("msgs").innerHTML="";
s.forEach(d=>{
let x=d.data(),m=document.createElement("div");
m.className="m "+(x.uid===me.uid?"mine":"");
if(x.audio){
let a=document.createElement("audio");a.controls=true;a.src=x.audio;m.appendChild(a);
}else m.textContent=x.text||"";
$("msgs").appendChild(m);
});
$("msgs").scrollTop=$("msgs").scrollHeight;
});
}

function watchTyping(){
onSnapshot(doc(db,"typing",chatId),s=>{
let x=s.data()||{};
$("typing").textContent=x.uid===to.uid&&x.on?"Ariko arandika...":"";
});
}

$("txt").oninput=async()=>{
if(!to)return;
await setDoc(doc(db,"typing",chatId),{uid:me.uid,on:true},{merge:true});
clearTimeout(window.t);
window.t=setTimeout(()=>setDoc(doc(db,"typing",chatId),{uid:me.uid,on:false},{merge:true}),900);
};

window.send=async()=>{
let t=$("txt").value.trim();
if(!t||!to)return;
await addDoc(collection(db,"chats",chatId,"messages"),{
uid:me.uid,toUid:to.uid,text:t,createdAt:serverTimestamp()
});
$("txt").value="";
};

window.record=async()=>{
if(recorder?.state==="recording"){recorder.stop();return}
try{
let s=await navigator.mediaDevices.getUserMedia({audio:true});
chunks=[];recorder=new MediaRecorder(s);
recorder.ondataavailable=e=>chunks.push(e.data);
recorder.onstop=()=>{
s.getTracks().forEach(t=>t.stop());
let r=new FileReader();
r.onload=async()=>{
if(r.result.length>900000)return alert("Ijwi ni rirerire.");
await addDoc(collection(db,"chats",chatId,"messages"),{
uid:me.uid,toUid:to.uid,audio:r.result,createdAt:serverTimestamp()
});
};
r.readAsDataURL(new Blob(chunks,{type:"audio/webm"}));
$("rec").textContent="🎙️";
};
recorder.start();$("rec").textContent="⏹️";
}catch(e){alert("Emera microphone muri browser.");}
};

window.makeCall=async type=>{
if(!to)return;
try{
stream=await navigator.mediaDevices.getUserMedia({audio:true,video:type==="video"});
$("local").srcObject=stream;$("call").style.display="block";
pc=new RTCPeerConnection(ice);
stream.getTracks().forEach(t=>pc.addTrack(t,stream));
pc.ontrack=e=>$("remote").srcObject=e.streams[0];
callId=chatId+"_"+Date.now();
let ref=doc(db,"calls",callId);
pc.onicecandidate=e=>e.candidate&&updateDoc(ref,{candidates:arrayUnion(JSON.stringify(e.candidate.toJSON()))});
await setDoc(ref,{caller:me.uid,receiver:to.uid,type,status:"calling",candidates:[]});
let o=await pc.createOffer();
await pc.setLocalDescription(o);
await updateDoc(ref,{offer:{type:o.type,sdp:o.sdp}});
watchCall(ref,true);
}catch(e){alert("Call ntishoboye gutangura. Emeza Camera/Microphone.");}
};

function watchIncoming(){
onSnapshot(collection(db,"calls"),s=>{
s.docChanges().forEach(c=>{
let x=c.doc.data();
if(x.receiver===me.uid&&x.status==="calling"){
callId=c.doc.id;incoming=x;
$("ctype").textContent=x.type==="video"?"📹 Video Call":"📞 Audio Call";
$("incoming").style.display="block";
}
});
});
}

window.answer=async()=>{
$("incoming").style.display="none";
to=await getUser(incoming.caller);
stream=await navigator.mediaDevices.getUserMedia({audio:true,video:incoming.type==="video"});
$("local").srcObject=stream;$("call").style.display="block";
pc=new RTCPeerConnection(ice);
stream.getTracks().forEach(t=>pc.addTrack(t,stream));
pc.ontrack=e=>$("remote").srcObject=e.streams[0];
let ref=doc(db,"calls",callId),x=(await getDoc(ref)).data();
await pc.setRemoteDescription(x.offer);
let a=await pc.createAnswer();
await pc.setLocalDescription(a);
pc.onicecandidate=e=>e.candidate&&updateDoc(ref,{candidates:arrayUnion(JSON.stringify(e.candidate.toJSON()))});
await updateDoc(ref,{answer:{type:a.type,sdp:a.sdp},status:"connected"});
watchCall(ref,false);
};

async function getUser(uid){
let d=await getDoc(doc(db,"users",uid));
return d.exists()?{uid,...d.data()}:null;
}

function watchCall(ref,caller){
onSnapshot(ref,async s=>{
let x=s.data();if(!x||!pc)return;
if(caller&&x.answer&&!pc.currentRemoteDescription)
await pc.setRemoteDescription(x.answer);
if(x.status==="ended")endCall(false);
if(x.candidates&&pc.remoteDescription)
for(let z of x.candidates)try{await pc.addIceCandidate(JSON.parse(z))}catch(e){}
});
}

window.reject=async()=>{
await updateDoc(doc(db,"calls",callId),{status:"ended"});
$("incoming").style.display="none";
};

window.toggleMic=()=>{
let t=stream?.getAudioTracks()[0];if(t)t.enabled=!t.enabled;
};
window.toggleCam=()=>{
let t=stream?.getVideoTracks()[0];if(t)t.enabled=!t.enabled;
};

window.endCall=async local=>{
if(local!==false&&callId)
await updateDoc(doc(db,"calls",callId),{status:"ended"}).catch(()=>{});
stream?.getTracks().forEach(t=>t.stop());
pc?.close();stream=null;pc=null;
$("call").style.display="none";
};

window.back=()=>{
if($("chat").style.display==="block"){
$("chat").style.display="none";$("users").style.display="block";
}else location.href="home.html";
};

addEventListener("beforeunload",()=>me&&setPresence(false));
</script>
</body>
</html>
