<!DOCTYPE html>
<html lang="rn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Depp Net Chat</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#eef2f7}
header{height:55px;background:#1877f2;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 10px}
button{border:0;border-radius:20px;padding:9px 13px}
#users{padding:10px}
.user{background:white;padding:12px;margin:8px 0;border-radius:15px;display:flex;align-items:center;gap:10px}
.av{width:45px;height:45px;border-radius:50%;background:#1877f2;color:white;display:grid;place-items:center;font-weight:bold}
.info{flex:1}
#chat{display:none;height:calc(100vh - 55px)}
.top{height:58px;background:white;display:flex;align-items:center;gap:8px;padding:7px}
#msgs{height:calc(100% - 115px);overflow:auto;padding:10px}
.msg{max-width:75%;padding:8px 10px;margin:6px 0;background:white;border-radius:16px}
.mine{margin-left:auto;background:#1877f2;color:white}
.msg img,.msg video{max-width:220px;border-radius:12px;display:block}
.send{min-height:57px;background:white;display:flex;align-items:center;gap:4px;padding:6px}
#txt{flex:1;border:1px solid #ddd;border-radius:22px;padding:10px;outline:0}
#pick{display:none;align-items:center;background:#f1f3f5;border-radius:15px;padding:3px}
#pick img{width:42px;height:42px;object-fit:cover;border-radius:10px}
#pick span{max-width:90px;overflow:hidden;white-space:nowrap}
#loading{display:none;color:#1877f2;font-size:12px}
</style>
</head>

<body>

<header>
<button onclick="goBack()">←</button>
<b>Depp Net</b>
<button onclick="location.href='home.html'">⌂</button>
</header>

<div id="users">Turiko turarondera...</div>

<div id="chat">
<div class="top">
<button onclick="goBack()">←</button>
<div class="av" id="avatar">U</div>
<div class="info"><b id="chatName">User</b></div>
</div>

<div id="msgs"></div>

<div class="send">

<button onclick="photo.click()">📷</button>
<input id="photo" type="file" accept="image/*" hidden onchange="choosePhoto()">

<button onclick="video.click()">🎥</button>
<input id="video" type="file" accept="video/*" hidden onchange="chooseVideo()">

<div id="pick"></div>

<input id="txt" placeholder="Andika ubutumwa...">

<span id="loading">...</span>
<button onclick="send()">➤</button>

</div>
</div>

<script type="module">

import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getAuth,onAuthStateChanged,setPersistence,browserLocalPersistence}
from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{getFirestore,collection,addDoc,onSnapshot,query,orderBy,serverTimestamp}
from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const app=initializeApp({
apiKey:"AIzaSyAddn7bUZfDupIqfSvBbXRpxarFAsV2lYs",
authDomain:"depp-net-apk.firebaseapp.com",
projectId:"depp-net-apk",
storageBucket:"depp-net-apk.firebasestorage.app",
messagingSenderId:"664141462348",
appId:"1:664141462348:web:8202143fef6fcdaf9cede9"
});

const auth=getAuth(app),db=getFirestore(app);
await setPersistence(auth,browserLocalPersistence);

const CLOUD="sdtggm0f",PRESET="yvgqax4x";

let me=null,other=null,chatId=null,stopMessages=null;
let pending=null,type=null;

onAuthStateChanged(auth,u=>{
if(!u)return location.href="login.html";
me=u;loadUsers();
});

function loadUsers(){
onSnapshot(collection(db,"users"),snap=>{
users.innerHTML="";

snap.forEach(d=>{
if(d.id===me.uid)return;

const u={uid:d.id,...d.data()};
const div=document.createElement("div");

div.className="user";
div.innerHTML=
`<div class="av">${(u.name||"U")[0].toUpperCase()}</div>
<div class="info"><b>${u.name||"User"}</b><br>
<small>@${u.username||""}</small></div>`;

div.onclick=()=>openChat(u);
users.appendChild(div);
});

if(!users.innerHTML)
users.innerHTML="<p>Nta bandi bakoresha Depp Net ubu.</p>";
});
}

function openChat(u){
other=u;
chatId=[me.uid,other.uid].sort().join("_");

users.style.display="none";
chat.style.display="block";

chatName.textContent=other.name||"User";
avatar.textContent=(other.name||"U")[0].toUpperCase();

loadMessages();
}

function loadMessages(){

if(stopMessages)stopMessages();

const q=query(
collection(db,"chats",chatId,"messages"),
orderBy("createdAt")
);

stopMessages=onSnapshot(q,snap=>{
msgs.innerHTML="";

snap.forEach(d=>{
const x=d.data();
const div=document.createElement("div");

div.className="msg "+(x.uid===me.uid?"mine":"");

if(x.mediaType==="image"){
const im=document.createElement("img");
im.src=x.media;
div.appendChild(im);
}
else if(x.mediaType==="video"){
const v=document.createElement("video");
v.src=x.media;
v.controls=true;
div.appendChild(v);
}
else{
div.textContent=x.text||"";
}

msgs.appendChild(div);
});

msgs.scrollTop=msgs.scrollHeight;
});
}

window.choosePhoto=async()=>{

const f=photo.files[0];
if(!f)return;

if(f.size>8*1024*1024){
alert("Photo ntirenge 8MB.");
photo.value="";
return;
}

pending=await compressPhoto(f);
type="image";

pick.innerHTML=
`<img src="${URL.createObjectURL(pending)}">
<button onclick="cancelPick()">✕</button>`;

pick.style.display="flex";
};

function compressPhoto(file){

return new Promise(resolve=>{

const img=new Image();

img.onload=()=>{

const max=1200;
let w=img.width,h=img.height;

if(w>max){
h=h*max/w;
w=max;
}

const c=document.createElement("canvas");
c.width=w;
c.height=h;

c.getContext("2d").drawImage(img,0,0,w,h);

c.toBlob(b=>resolve(
new File([b],"photo.jpg",{type:"image/jpeg"})
),"image/jpeg",.65);

};

img.src=URL.createObjectURL(file);
});
}

window.chooseVideo=()=>{

const f=video.files[0];
if(!f)return;

if(f.size>10*1024*1024){
alert("Video ntirenge 10MB kugira yihute.");
video.value="";
return;
}

pending=f;
type="video";

pick.innerHTML=
`<span>🎥 ${f.name}</span>
<button onclick="cancelPick()">✕</button>`;

pick.style.display="flex";
};

window.cancelPick=()=>{
pending=null;
type=null;
photo.value="";
video.value="";
pick.innerHTML="";
pick.style.display="none";
};

window.send=async()=>{

if(pending){
await sendMedia();
return;
}

const text=txt.value.trim();
if(!text||!other)return;

await addDoc(
collection(db,"chats",chatId,"messages"),
{
uid:me.uid,
toUid:other.uid,
text:text,
createdAt:serverTimestamp()
}
);

txt.value="";
};

async function sendMedia(){

if(!pending)return;

loading.style.display="inline";

try{

const fd=new FormData();
fd.append("file",pending);
fd.append("upload_preset",PRESET);

const endpoint=
`https://api.cloudinary.com/v1_1/${CLOUD}/`+
(type==="image"?"image":"video")+
"/upload";

const r=await fetch(endpoint,{
method:"POST",
body:fd
});

const x=await r.json();

if(!r.ok){
alert(x.error?.message||"Media yanse kurungikwa.");
return;
}

await addDoc(
collection(db,"chats",chatId,"messages"),
{
uid:me.uid,
toUid:other.uid,
media:x.secure_url,
mediaType:type,
createdAt:serverTimestamp()
}
);

cancelPick();

}catch(e){
alert("Vyaranse: "+e.message);
}

loading.style.display="none";
}

window.goBack=()=>{

if(chat.style.display==="block"){

if(stopMessages)stopMessages();

chat.style.display="none";
users.style.display="block";

}else{
location.href="home.html";
}

};

</script>
</body>
</html>
