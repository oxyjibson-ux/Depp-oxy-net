<!DOCTYPE html>
<html lang="rn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Depp Net - Contacts</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#f2f5f9;color:#222}
header{height:60px;background:#1877f2;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 14px}
header b{font-size:21px}
button{border:0;border-radius:10px;padding:10px 13px;font-weight:bold}
.home{background:white;color:#1877f2}
.main{max-width:650px;margin:auto;padding:14px}
.card{background:white;border-radius:16px;padding:15px;margin-bottom:14px;box-shadow:0 2px 8px #0001}
.title{font-size:19px;font-weight:bold;margin-bottom:12px}
.searchbox{display:flex;gap:7px}
input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:11px;font-size:15px;outline:0}
.searchbox button{background:#1877f2;color:white;font-size:18px}
.add{background:#1877f2;color:white;width:100%;font-size:15px}
.contact{display:flex;align-items:center;gap:11px;padding:12px;background:#f4f6f8;border-radius:13px;margin-top:9px}
.avatar{width:46px;height:46px;border-radius:50%;background:#1877f2;color:white;display:grid;place-items:center;font-size:19px;font-weight:bold}
.info{flex:1;min-width:0}
.name{font-weight:bold}
.phone{font-size:12px;color:#777;margin-top:4px}
.chat{background:#1877f2;color:white}
.status{text-align:center;color:#777;padding:18px}
.line{height:1px;background:#eee;margin:14px 0}
</style>
</head>

<body>

<header>
<b>Depp Net</b>
<button class="home" onclick="location.href='home.html'">🏠 Home</button>
</header>

<div class="main">

<div class="card">
<div class="title">🔎 Rondera kuri Depp Net</div>

<div class="searchbox">
<input id="searchPhone" type="tel" placeholder="Andika numero...">
<button onclick="findUser()">🔎</button>
</div>

<div id="searchResult" class="status">
Rondera umuntu ukoresheje numero.
</div>
</div>

<div class="card">
<div class="title">➕ Contact nshasha</div>

<input id="name" placeholder="Izina ry'umuntu">

<br><br>

<select id="country"></select>

<br><br>

<input id="phone" type="tel" placeholder="Numero ya telefone">

<p id="preview" style="font-size:12px;color:#777"></p>

<button class="add" onclick="saveContact()">
💾 Bika Contact
</button>
</div>

<div class="card">
<div class="title">👥 Contacts zawe</div>
<input id="filter" placeholder="Rondera muri Contacts zawe...">
<div id="list"><div class="status">⏳ Rindira...</div></div>
</div>

</div>

<script type="module">

import{initializeApp}
from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{getAuth,onAuthStateChanged}
from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import{
getFirestore,collection,query,where,getDocs,
doc,setDoc,onSnapshot
}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const app=initializeApp({
apiKey:"AIzaSyAddn7bUZfDupIqfSvBbXRpxarFAsV2lYs",
authDomain:"depp-net-apk.firebaseapp.com",
projectId:"depp-net-apk",
storageBucket:"depp-net-apk.firebasestorage.app",
messagingSenderId:"664141462348",
appId:"1:664141462348:web:8202143fef6fcdaf9cede9"
});

const auth=getAuth(app),db=getFirestore(app);

let me=null,contacts=[];

const countries=[
["🇧🇮","Burundi","257"],["🇷🇼","Rwanda","250"],
["🇨🇩","RDC","243"],["🇹🇿","Tanzania","255"],
["🇺🇬","Ouganda","256"],["🇰🇪","Kenya","254"],
["🇿🇦","Afrique du Sud","27"],["🇳🇬","Nigeria","234"],
["🇬🇭","Ghana","233"],["🇨🇲","Cameroun","237"],
["🇨🇮","Côte d’Ivoire","225"],["🇸🇳","Sénégal","221"],
["🇲🇱","Mali","223"],["🇧🇫","Burkina Faso","226"],
["🇳🇪","Niger","227"],["🇹🇬","Togo","228"],
["🇧🇯","Bénin","229"],["🇬🇳","Guinée","224"],
["🇬🇦","Gabon","241"],["🇨🇬","Congo","242"],
["🇲🇬","Madagascar","261"],["🇲🇿","Mozambique","258"],
["🇿🇲","Zambie","260"],["🇿🇼","Zimbabwe","263"],
["🇪🇬","Égypte","20"],["🇲🇦","Maroc","212"],
["🇩🇿","Algérie","213"],["🇹🇳","Tunisie","216"],
["🇦🇪","Émirats arabes unis","971"],["🇸🇦","Arabie Saoudite","966"],
["🇶🇦","Qatar","974"],["🇰🇼","Koweït","965"],
["🇹🇷","Turquie","90"],["🇫🇷","France","33"],
["🇧🇪","Belgique","32"],["🇩🇪","Allemagne","49"],
["🇨🇭","Suisse","41"],["🇮🇹","Italie","39"],
["🇪🇸","Espagne","34"],["🇵🇹","Portugal","351"],
["🇳🇱","Pays-Bas","31"],["🇬🇧","Royaume-Uni","44"],
["🇺🇸","USA","1"],["🇨🇦","Canada","1"],
["🇧🇷","Brésil","55"],["🇲🇽","Mexique","52"],
["🇦🇷","Argentine","54"],["🇮🇳","Inde","91"],
["🇵🇰","Pakistan","92"],["🇨🇳","Chine","86"],
["🇯🇵","Japon","81"],["🇰🇷","Corée du Sud","82"],
["🇮🇩","Indonésie","62"],["🇲🇾","Malaisie","60"],
["🇸🇬","Singapour","65"],["🇦🇺","Australie","61"],
["🇳🇿","Nouvelle-Zélande","64"],["🇷🇺","Russie","7"],
["🇪🇹","Éthiopie","251"],["🇸🇴","Somalie","252"]
];

countries.forEach(c=>{
let o=document.createElement("option");
o.value=c[2];
o.textContent=`${c[0]} ${c[1]} (+${c[2]})`;
country.appendChild(o);
});
country.value="257";

function fullPhone(input){
let code=country.value;
let n=input.replace(/\D/g,"");
if(n.startsWith("00"))n=n.slice(2);
if(n.startsWith(code))return"+"+n;
if(n.startsWith("0"))n=n.slice(1);
return"+"+code+n;
}

phone.oninput=()=>{
preview.textContent="Numero: "+fullPhone(phone.value);
};

function esc(x){
let d=document.createElement("div");
d.textContent=x||"";
return d.innerHTML;
}

onAuthStateChanged(auth,u=>{
if(!u)return location.href="login.html";
me=u;
loadContacts();
});

async function findByPhone(p){

let r=await getDocs(query(
collection(db,"users"),where("phone","==",p)
));

if(!r.empty)return r.docs[0];

let n=p.replace("+","");
r=await getDocs(query(
collection(db,"users"),where("phone","==",n)
));

return r.empty?null:r.docs[0];
}

window.findUser=async()=>{

let p=fullPhone(searchPhone.value);

if(p.length<7){
alert("Andika numero neza.");
return;
}

searchResult.innerHTML="⏳ Turiko turarondera...";

let u=await findByPhone(p);

if(!u){
searchResult.innerHTML=
"❌ Uwo muntu ntarafungura konti ya Depp Net.";
return;
}

if(u.id===me.uid){
searchResult.innerHTML="👤 Iyo ni numero yawe.";
return;
}

let d=u.data();

searchResult.innerHTML=`
<div class="contact">
<div class="avatar">${esc((d.name||"U")[0])}</div>
<div class="info">
<div class="name">${esc(d.name||"User")}</div>
<div class="phone">📞 ${esc(p)}</div>
</div>
<button class="chat"
onclick="chat('${u.id}','${esc(d.name||"User")}')">
💬
</button>
</div>`;
};

window.saveContact=async()=>{

let n=name.value.trim();
let p=fullPhone(phone.value);

if(!n||p.length<7){
alert("Shiramwo izina na numero neza.");
return;
}

if(p===me.phone){
alert("Iyo ni numero yawe.");
return;
}

try{

let u=await findByPhone(p);
let data={
name:n,
phone:p,
uid:u?u.id:"",
deppNet:u?true:false
};

await setDoc(
doc(db,"users",me.uid,"contacts",p.replace(/\D/g,"")),
data
);

name.value="";
phone.value="";
preview.textContent="";

alert(u?
"Contact yabitswe. Ubu akoresha Depp Net. 💬":
"Contact yabitswe. Ntarakoresha Depp Net.");

loadContacts();

}catch(e){
alert("Vyaranse kubika contact.");
}
};

async function loadContacts(){

let s=await getDocs(
collection(db,"users",me.uid,"contacts")
);

contacts=s.docs.map(d=>({
id:d.id,...d.data()
}));

render();
}

filter.oninput=render;

function render(){

let q=filter.value.toLowerCase().trim();

let a=contacts.filter(x=>
!q||
(x.name||"").toLowerCase().includes(q)||
(x.phone||"").includes(q)
);

if(!a.length){
list.innerHTML='<div class="status">📱 Nta contacts zibitswe.</div>';
return;
}

list.innerHTML=a.map(x=>`

<div class="contact">
<div class="avatar">
${esc((x.name||"U")[0].toUpperCase())}
</div>

<div class="info">
<div class="name">${esc(x.name||"Contact")}</div>
<div class="phone">📞 ${esc(x.phone)}</div>
</div>

${x.deppNet?
`<button class="chat"
onclick="chat('${x.uid}','${esc(x.name)}')">💬</button>`:
`<span style="font-size:12px;color:#888">Nta Depp Net</span>`}

</div>

`).join("");
}

window.chat=(uid,n)=>{

localStorage.setItem(
"deppNetSelectedContactUid",uid
);

localStorage.setItem(
"deppNetSelectedContactName",n
);

location.href="chat.html";
};

</script>
</body>
</html>
