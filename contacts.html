<script type="module">

import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{
getFirestore,collection,query,where,getDocs,setDoc,doc,onSnapshot
}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyAddn7bUZfDupIqfSvBbXRpxarFAsV2lYs",
authDomain:"depp-net-apk.firebaseapp.com",
projectId:"depp-net-apk",
storageBucket:"depp-net-apk.firebasestorage.app",
messagingSenderId:"664141462348",
appId:"1:664141462348:web:8202143fef6fcdaf9cede9",
measurementId:"G-DMBZT3C6MK"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
let me=null,all=[];

const $=id=>document.getElementById(id);
const digits=x=>String(x||"").replace(/\D/g,"");

async function findUser(phone){

let p=digits(phone);
if(!p)return null;

let q=query(collection(db,"users"),where("phone","==",p));
let r=await getDocs(q);
if(!r.empty)return r.docs[0];

q=query(collection(db,"users"),where("phone","==","+"+p));
r=await getDocs(q);
if(!r.empty)return r.docs[0];

return null;
}

function esc(x){
return String(x||"").replace(/&/g,"&amp;").replace(/</g,"&lt;")
.replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

async function show(items){

if(!items.length){
$("list").innerHTML="<p class='none'>Nta contact urabika.</p>";
return;
}

$("list").innerHTML="Turiko turagenzura...";

let html="";

for(const x of items){

let u=null;

try{u=await findUser(x.phone)}catch(e){}

if(u){

let d=u.data();

await setDoc(
doc(db,"users",me.uid,"contacts",x.id),
{
...x,
uid:u.id,
deppNet:true,
username:d.username||""
},
{merge:true}
);

html+=`
<div class="contact">
<div class="info">
<b>${esc(x.name||d.name||"Contact")}</b>
<small>${esc(x.phone)}</small>
</div>
<button class="chat"
onclick="goChat('${u.id}','${esc(x.name||d.name||"Contact")}','${esc(x.phone)}')">
💬 Chat
</button>
</div>`;

}else{

html+=`
<div class="contact">
<div class="info">
<b>${esc(x.name||"Contact")}</b>
<small>${esc(x.phone)}</small>
</div>
<span class="none">Nta Depp Net</span>
</div>`;

}

}

$("list").innerHTML=html;
}

function load(){

onSnapshot(
collection(db,"users",me.uid,"contacts"),
snap=>{
all=snap.docs.map(x=>({id:x.id,...x.data()}));
show(all);
}
);

}

window.saveContact=async()=>{

let name=$("name").value.trim();
let n=digits($("phone").value);
let code=digits($("code").value);

if(!name){
$("msg").textContent="Andika izina.";
return;
}

if(!n){
$("msg").textContent="Andika numero.";
return;
}

let phone=code+n;

$("msg").textContent="Turiko turarondera...";

try{

let u=await findUser(phone);

await setDoc(
doc(db,"users",me.uid,"contacts",phone),
{
name:name,
phone:phone,
uid:u?u.id:"",
deppNet:!!u,
createdAt:new Date()
},
{merge:true}
);

$("name").value="";
$("phone").value="";

$("msg").textContent=u
?"✅ Yabonetse kuri Depp Net."
:"✅ Yabitswe. Nta Depp Net ubu.";

}catch(e){

console.log(e);
$("msg").textContent="❌ Ntivyashobotse kubika.";

}

};

window.goChat=(uid,name,phone)=>{

localStorage.setItem("deppNetSelectedContactUid",uid);
localStorage.setItem("deppNetSelectedContactName",name);
localStorage.setItem("deppNetSelectedContactPhone",phone);

location.href="chat.html";

};

window.toggleSearch=()=>{
let x=$("searchBox");
x.style.display=x.style.display=="none"?"block":"none";
};

$("search").oninput=()=>{
let s=$("search").value.toLowerCase();

show(all.filter(x=>
String(x.name||"").toLowerCase().includes(s)||
String(x.phone||"").includes(s)
));

};

onAuthStateChanged(auth,u=>{

if(!u){
location.href="login.html";
return;
}

me=u;
load();

});

</script>
